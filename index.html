function pickCardsForCompose(n){
  const c = curChar();
  const pool = (c.cards || []).filter(x => x && x.text && String(x.text).trim());
  if(!pool.length) return '';
  const sh = pool.slice();
  for(let i = sh.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
  const count = Math.min(n, sh.length);
  return sh.slice(0, count).map(x => String(x.text).trim()).join('\n');
}
function playSound(name){
  if(!S.settings.sound || name === '静音') return;
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; audioCtx = new AC(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    if(name === '默认' || name === '微信'){
      const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
      o1.type='sine'; o1.frequency.setValueAtTime(880, t0);
      g1.gain.setValueAtTime(0.0001, t0); g1.gain.linearRampToValueAtTime(0.09, t0+0.012);
      g1.gain.exponentialRampToValueAtTime(0.0001, t0+0.14);
      o1.connect(g1); g1.connect(audioCtx.destination); o1.start(t0); o1.stop(t0+0.16);
      const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
      o2.type='sine'; o2.frequency.setValueAtTime(660, t0+0.10);
      g2.gain.setValueAtTime(0.0001, t0+0.10); g2.gain.linearRampToValueAtTime(0.075, t0+0.112);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0+0.24);
      o2.connect(g2); g2.connect(audioCtx.destination); o2.start(t0+0.10); o2.stop(t0+0.26);
      return;
    }
    const PRESETS = { '清脆':{freq:1320,type:'triangle',dur:0.14,vol:0.075}, '柔和':{freq:600,type:'sine',dur:0.30,vol:0.065}, '木鱼':{freq:380,type:'sine',dur:0.10,vol:0.055}, '水滴':{freq:1150,type:'sine',dur:0.24,vol:0.075,slide:-520} };
    const p = PRESETS[name] || PRESETS['柔和'];
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type=p.type; osc.frequency.setValueAtTime(p.freq, t0);
    if(p.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(90, p.freq+p.slide), t0+p.dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(p.vol, t0+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+p.dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(t0); osc.stop(t0+p.dur+0.03);
  }catch(e){}
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function avatarHTML(obj, extra){
  const cls = ['avatar', extra||''];
  if(obj.frame && obj.frame !== 'none') cls.push('frame-'+obj.frame);
  const initial = (obj.name||'?').trim().slice(0,1).toUpperCase();
  const style = obj.avatar ? ` style="background-image:url('${obj.avatar}')"` : '';
  return `<div class="${cls.join(' ')}"${style}>${obj.avatar?'':esc(initial)}</div>`;
}

const RENDERERS = {};

/* ================= 主 UI ================= */
function startUI(){

  function requestNotifPermission(){
    try{ if(!('Notification' in window)) return; if(Notification.permission === 'default'){ const r = Notification.requestPermission(); if(r && r.catch) r.catch(()=>{}); } }catch(e){}
  }
  function sendNotification(title, body){
    try{
      if(!('Notification' in window)) return;
      if(Notification.permission !== 'granted') return;
      const n = new Notification(title, { body: String(body||'').slice(0,100), tag: 'whisper-'+Date.now(), renotify: true, silent: false });
      n.onclick = function(){ try{ window.focus(); }catch(e){} try{ n.close(); }catch(e){} try{ switchTab('chat'); }catch(e){} };
      setTimeout(()=>{ try{ n.close(); }catch(e){} }, 9000);
    }catch(e){}
  }

  function switchTab(tab){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id === 'v-'+tab));
    if(tab !== 'chat') closeEmojiPanel();
    if(RENDERERS[tab]) RENDERERS[tab]();
  }

  /* ============================================================
     音乐播放器（全局）
     ============================================================ */
  const audioPlayer = { audio:null, src:'', name:'', playing:false, index:-1 };
  const miniPlayerEl = $('#miniPlayer');
  const mpNameEl = $('#mpName');
  const mpStatusEl = $('#mpStatus');
  const mpToggleEl = $('#mpToggle');

  function updateMiniPlayer(){
    if(audioPlayer.index < 0 || !audioPlayer.audio){
      miniPlayerEl.classList.remove('show','playing');
      return;
    }
    miniPlayerEl.classList.add('show');
    miniPlayerEl.classList.toggle('playing', audioPlayer.playing);
    mpNameEl.textContent = audioPlayer.name || '—';
    mpStatusEl.textContent = audioPlayer.playing ? '正在播放' : '已暂停';
    mpToggleEl.textContent = audioPlayer.playing ? '⏸' : '▶';
  }

  function togglePlay(){
    if(!audioPlayer.audio){ return; }
    if(audioPlayer.playing){
      try{ audioPlayer.audio.pause(); }catch(e){}
      audioPlayer.playing = false;
      toast('⏸ 已暂停：' + audioPlayer.name);
      updateMiniPlayer();
    } else {
      audioPlayer.audio.play().then(()=>{
        audioPlayer.playing = true;
        toast('▶ 继续播放：' + audioPlayer.name);
        updateMiniPlayer();
      }).catch(()=>{ toast('播放失败'); });
    }
  }

  function closePlayer(){
    if(audioPlayer.audio){
      try{ audioPlayer.audio.pause(); }catch(e){}
    }
    audioPlayer.audio = null;
    audioPlayer.src = '';
    audioPlayer.name = '';
    audioPlayer.playing = false;
    audioPlayer.index = -1;
    updateMiniPlayer();
    toast('已停止播放');
  }

  function playTrack(index){
    const s = S.playlist[index];
    if(!s){ toast('歌曲不存在'); return; }

    /* 同一首：切暂停/继续 */
    if(audioPlayer.index === index && audioPlayer.audio){
      togglePlay();
      return;
    }

    /* 换歌：先停当前 */
    if(audioPlayer.audio){
      try{ audioPlayer.audio.pause(); }catch(e){}
    }

    const audio = new Audio();
    audio.preload = 'auto';
    audio.onended = ()=>{
      audioPlayer.playing = false;
      updateMiniPlayer();
      toast('🏁 播放结束：' + s.name);
    };
    audio.onerror = ()=>{
      audioPlayer.playing = false;
      updateMiniPlayer();
      toast('播放失败，请检查链接或文件');
    };
    audio.src = s.src;

    audio.play().then(()=>{
      audioPlayer.audio = audio;
      audioPlayer.src = s.src;
      audioPlayer.name = s.name;
      audioPlayer.index = index;
      audioPlayer.playing = true;
      updateMiniPlayer();
      toast('▶ 正在播放：' + s.name);
      /* 给 TA 发一条 */
      pushMsg({ id:uid(), from:'me', type:'text', text:`🎧 和你一起听：${s.name}`, ts:Date.now() }, true);
      setTimeout(()=>{
        pushMsg({ id:uid(), from:'them', type:'text', text: rand(['好听。','这首我也喜欢。','嗯，在听。','陪着你听。']), ts:Date.now() }, true);
        playSound(curChar().sound);
      }, 1600 + Math.random()*1500);
    }).catch(err=>{
      console.error('播放失败:', err);
      toast('播放失败，请检查链接或文件');
    });
  }

  mpToggleEl.addEventListener('click', togglePlay);
  $('#mpClose').addEventListener('click', closePlayer);

  /* 本地音频文件上传 */
  function pickAudioFiles(cb){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'audio/*,.mp3,.m4a,.wav,.flac,.ogg,.aac';
    inp.multiple = true;
    inp.onchange = ()=>{
      const files = Array.from(inp.files || []);
      if(!files.length) return;
      const MAX_SIZE = 15 * 1024 * 1024; /* 15MB */
      let finished = 0, added = 0, skipped = 0;

      function done(){
        saveNow();
        if(added) toast('🎵 已添加 ' + added + ' 首本地音乐' + (skipped ? '，' + skipped + ' 首超过 15MB 已跳过' : ''));
        else if(skipped) toast('文件超过 15MB，未添加');
        if(cb) cb();
      }

      files.forEach(f=>{
        if(f.size > MAX_SIZE){
          skipped++;
          finished++;
          if(finished === files.length) done();
          return;
        }
        const r = new FileReader();
        r.onload = ev=>{
          const name = (f.name || '').replace(/\.[^.]+$/,'') || '未命名';
          S.playlist.push({ name, src: ev.target.result, isLocal: true });
          added++;
          finished++;
          if(finished === files.length) done();
        };
        r.onerror = ()=>{
          skipped++;
          finished++;
          if(finished === files.length) done();
        };
        r.readAsDataURL(f);
      });
    };
    inp.click();
  }

  function calcNextPeriod(){
    const records = S.period.records || [];
    if(!records.length) return null;
    const sorted = records.filter(r=>r.start).map(r=>new Date(r.start+'T00:00:00')).sort((a,b)=>b-a);
    if(!sorted.length) return null;
    const last = sorted[0];
    const cycle = S.period.cycle || 28;
    const today = new Date(); today.setHours(0,0,0,0);
    let next = new Date(last); next.setDate(next.getDate() + cycle);
    let tries = 0;
    while(next < today && tries < 24){ next.setDate(next.getDate() + cycle); tries++; }
    return { daysLeft: Math.round((next - today) / 86400000), dateStr: (next.getMonth()+1)+'月'+next.getDate()+'日' };
  }

  function findRecentMyMessage(){
    const arr = curMsgs();
    for(let i = arr.length - 1; i >= 0; i--){
      const m = arr[i];
      if(!m) continue;
      if(m.from === 'me' && (m.type === 'text' || m.type === 'sticker' || m.type === 'image')){

        return null;

    }

  function scheduleReply(onFinish){
    replyTimers.forEach(clearTimeout);
    replyTimers = [];
    const c = curChar();
    const minR = Math.max(5000, c.minReply || 5000);
    const maxR = Math.max(minR, c.maxReply || 120000);
    const total = Math.floor(minR + Math.random() * (maxR - minR));

    try{
      const arr = curMsgs();
      let changed = false;
      arr.forEach(m=>{ if(m && m.from === 'me' && !m.read){ m.read = true; changed = true; } });
      if(changed){ saveNow(); renderMessages(); }
    }catch(e){ console.error('标记已读失败:', e); }

    if(c.readButNoReply && Math.random() < 0.20){ if(onFinish) setTimeout(onFinish, 500); return; }

    const count = 1 + Math.floor(Math.random() * 3);
    const generated = [];
    const usedTexts = new Set();
    const myRecent = findRecentMyMessage();
    const doQuote = myRecent && Math.random() < 0.35;

    for(let i = 0; i < count; i++){
      const useTheirSticker = c.theirEmojis.length > 0 && Math.random() < 0.30;
      const cards = c.cards.filter(x => x.text && !usedTexts.has(x.text));
      let replyText;
      if(useTheirSticker){ replyText = rand(c.theirEmojis); }
      else {
        const pool = cards.length ? cards : c.cards.filter(x=>x.text);
        replyText = pool.length ? rand(pool).text : '嗯。';
      }
      usedTexts.add(replyText);
      const msg = {};
      if(useTheirSticker){
        const isImg = /^data:/.test(replyText);
        if(isImg){ msg.type = 'image'; msg.data = replyText; }
        else { msg.type = 'sticker'; msg.text = replyText; }
      } else { msg.type = 'text'; msg.text = replyText; }
      generated.push(msg);
    }
    if(doQuote && generated[0]){
      let qtext = '';
      if(myRecent.type === 'text') qtext = myRecent.text;
      else if(myRecent.type === 'sticker') qtext = myRecent.text;
      else if(myRecent.type === 'image') qtext = '[图片]';
      generated[0].quote = { name: S.user.name, text: qtext, img: myRecent.type==='image' ? myRecent.data : null };
    }

    const showAt = Math.floor(total * 0.25);
    replyTimers.push(setTimeout(()=>{
      if(isChatActive()) updateChatSubtitle(true);
    }, showAt));

    replyTimers.push(setTimeout(()=>{
      try{
        updateChatSubtitle(false);
        const now = Date.now();
        generated.forEach((msg, i)=>{
          const m = Object.assign({ id: uid(), from: 'them', ts: now + i * 100 }, msg);
          pushMsg(m, true);
        });
        playSound(curChar().sound);
      }catch(e){ console.error('推送回复失败:', e); }
      if(onFinish) onFinish();
    }, total));
  }
  function enqueueReply(){ pendingReplies++; if(!replyRunning) runReplyChain(); }
  function runReplyChain(){
    if(pendingReplies <= 0){ replyRunning = false; return; }
    replyRunning = true;
    scheduleReply(()=>{ pendingReplies--; if(pendingReplies > 0) runReplyChain(); else replyRunning = false; });
  }

  const DIVIDER_GAP = 5 * 60 * 1000;
  function dividerNode(ts){
    const d = new Date(ts), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const y = new Date(now); y.setDate(now.getDate() - 1);
    const isYest = d.toDateString() === y.toDateString();
    let label = sameDay ? fmtTime(ts) : (isYest ? '昨天 ' + fmtTime(ts) : (d.getMonth()+1)+'月'+d.getDate()+'日 ' + fmtTime(ts));
    const el = document.createElement('div'); el.className = 'divider'; el.textContent = label;
    return el;
  }
  function needDivider(prevTs, ts){
    if(!prevTs || !ts) return false;
    const a = new Date(prevTs), b = new Date(ts);
    if(isNaN(a.getTime()) || isNaN(b.getTime())) return false;
    if(a.toDateString() !== b.toDateString()) return true;
    return (ts - prevTs) > DIVIDER_GAP;
  }

    if(m.type === 'choice') return { text: '[抉择]', img: null };
    if(m.type === 'call') return { text: '[通话]', img: null };
    return { text: '[消息]', img: null };
  }

  function msgNode(m){
    if(!m || typeof m !== 'object') return document.createElement('div');
    if(m.type === 'pat'){
      const d = document.createElement('div');
      d.className = 'sys-msg'; d.textContent = m.text || '';
      return d;
    }
    const c = curChar();
    const row = document.createElement('div');
    row.className = 'msg ' + (m.from === 'me' ? 'me' : 'them');
    if(m.id) row.dataset.id = m.id;
    const person = m.from === 'me' ? S.user : c;
    const av = avatarHTML(person, 'sm');
    let bodyHTML = '';
    const quoteHTML = m.quote ? `<div class="quote">${m.quote.img ? `<img class="quote-img" src="${m.quote.img}" alt="">` : ''}<span class="quote-text">${esc(m.quote.name)}：${esc(m.quote.text)}</span></div>` : '';
    if(m.type === 'sticker'){
      bodyHTML = `<div class="sticker-wrap"><span class="sticker-emoji">${esc(m.text)}</span></div>`;
    } else if(m.type === 'dice'){
      bodyHTML = `<div class="dice-box"><div class="dice-num">${diceChar(parseInt(m.text,10))}</div></div>`;
    } else if(m.type === 'redpacket'){
      const done = m.status === 'taken' || m.status === 'returned';
      const statusTxt = m.status === 'taken' ? '已领取' : m.status === 'returned' ? '已退回' : '点击拆开';
      bodyHTML = `<div class="redpacket ${done?'rp-done':''}" ${!done && m.from==='them' ? 'data-rp="'+m.id+'"' : ''}>
        <div class="rp-top"><span class="rp-ico">¥</span> 红包</div>

        ${m.text?`<div class="rp-note">${esc(m.text)}</div>`:''}

  function pushMsg(m, animate){

    arr.push(m);
    saveNow();

      const node = msgNode(m);
      if(animate === false) node.style.animation = 'none';

      scrollBottom(true);

      console.error('渲染消息失败:', e);

      let preview = '';
      if(m.type === 'text') preview = m.text;
      else if(m.type === 'sticker') preview = m.text || '[表情]';
      else if(m.type === 'image') preview = '[图片]';
      else if(m.type === 'redpacket') preview = '[红包]';
      else if(m.type === 'dice') preview = '[骰子]';

  function sendPhotoToThem(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = function(){
      const files = Array.from(this.files || []);
      if(!files.length) return;
      let finished = 0;
      files.forEach(f=>{
        const r = new FileReader();
        r.onload = ev=>{
          const img = new Image();
          img.onload = ()=>{
            const MAX = 500;
            let w = img.naturalWidth, h = img.naturalHeight;
            if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            const data = cv.toDataURL('image/jpeg', 0.75);
            const m = { id:uid(), from:'me', type:'image', data, ts:Date.now(), read:false };
            if(quoteTarget) m.quote = quoteTarget;
            if(finished === 0 && quoteTarget){ clearQuote(); }
            pushMsg(m, true);
            finished++;
            if(finished === files.length) enqueueReply();
          };
          img.src = ev.target.result;
        };
        r.readAsDataURL(f);
      });
    };
    inp.click();
  }

  function bindBurst(body){

          const img = new Image();

            const MAX = 400;
            let w = img.naturalWidth, h = img.naturalHeight;
            if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }

            cv.getContext('2d').drawImage(img, 0, 0, w, h);

            finished++; if(finished === files.length) refresh();
          };
          img.src = ev.target.result;
        };
        r.readAsDataURL(f);
      });
      this.value = '';
    });
    body.querySelector('#burstCancel').onclick = ()=>{ if(burstMessages.length && !confirm('放弃这些消息？')) return; burstMessages = []; closeSheet(); };
    body.querySelector('#burstSend').onclick = ()=>{

      burstMessages = [];

    body.querySelectorAll('[data-edit]').forEach(b=>{

    body.querySelectorAll('[data-del]').forEach(b=>{

    });
  }

  function renderCardPickerGroups(){
    const pool = getCardPickerPool();
    const groups = new Map();
    pool.forEach(card => {
      const g = card.group || '未分组';
      groups.set(g, (groups.get(g) || 0) + 1);
    });
    const groupNames = Array.from(groups.keys()).sort((a,b) => (a === '默认' || a === '基础字卡') ? -1 : 1);
    const wrap = $('#cppoGroups');
    wrap.innerHTML = `<button class="cppo-group ${cardPickerState.group==='__all__'?'active':''}" data-g="__all__">全部(${pool.length})</button>` +

  function renderCardPickerList(){
    let pool = getCardPickerPool();
    if(cardPickerState.group !== '__all__'){
      pool = pool.filter(x => (x.group || '未分组') === cardPickerState.group);
    }
    if(cardPickerState.search){
      const s = cardPickerState.search.toLowerCase();
      pool = pool.filter(x => (x.text||'').toLowerCase().includes(s));
    }
    const listEl = $('#cppoList');
    if(!pool.length){
      listEl.innerHTML = `<div class="cppo-empty">还没有字卡<br>在「我的」页面添加吧</div>`;
      return;
    }
    const selectedIds = new Set(cardPickerState.selected.map(x => x.id));
    listEl.innerHTML = pool.map(card => `
      <div class="cppo-item ${selectedIds.has(card.id)?'selected':''}" data-id="${card.id}">
        <div class="cp-check">✓</div>
        <div class="cp-text">${esc(card.text)}</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.cppo-item').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        const card = pool.find(x => x.id === id);
        if(!card) return;
        const idx = cardPickerState.selected.findIndex(x => x.id === id);
        if(idx >= 0){ cardPickerState.selected.splice(idx, 1); }
        else { cardPickerState.selected.push({ id, text: card.text, from: cardPickerState.tab }); }
        renderCardPickerList();
        renderCardPickerSelected();
      };
    });

  (function initMiniCall(){
    const el = $('#miniCall');
    const phone = document.querySelector('.phone');
    let sx=0, sy=0, sl=0, st=0, moved=false, dragging=false;
    function start(e){
      if(!el.classList.contains('show')) return;
      if(e.target.closest('.hang-mini')) return;
      const p = e.touches ? e.touches[0] : e;
      const elRect = el.getBoundingClientRect();
      const phoneRect = phone.getBoundingClientRect();
      sx = p.clientX; sy = p.clientY;
      sl = elRect.left - phoneRect.left; st = elRect.top - phoneRect.top;
      el.style.right = 'auto'; el.style.bottom = 'auto';
      el.style.left = sl + 'px'; el.style.top = st + 'px';
      moved = false; dragging = true; el.classList.add('dragging');
      document.addEventListener('mousemove', move);
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('mouseup', end);
      document.addEventListener('touchend', end);
    }
    function move(e){
      if(!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - sx, dy = p.clientY - sy;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      const phoneRect = phone.getBoundingClientRect();
      let nl = sl + dx, nt = st + dy;
      nl = Math.max(4, Math.min(phoneRect.width - el.offsetWidth - 4, nl));
      nt = Math.max(4, Math.min(phoneRect.height - el.offsetHeight - 4, nt));
      el.style.left = nl + 'px'; el.style.top = nt + 'px';
      if(e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false; el.classList.remove('dragging');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchend', end);
      if(moved){ el.dataset.moved = '1'; setTimeout(()=>{ el.dataset.moved = '0'; }, 80); }
    }
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('click', function(e){
      if(e.target.closest('.hang-mini')) return;
      if(el.dataset.moved === '1') return;
      if(!callMinimized) return;
      callMinimized = false; el.classList.remove('show');
      $('#callOverlay').classList.add('show');
    });
  })();

      });

  }

    const modal = $('#inviteModal');

      <div class="iv-ico thinking">🤔</div>
      <div class="iv-title">邀请TA下一盘${gameName}</div>
      <div class="iv-desc">TA 正在考虑<span class="iv-dots"><span></span><span></span><span></span></span></div>`;

          <div class="iv-ico">🤝</div>

  function startGame(game){
    if(game === 'memory') startMemory();
    else if(game === 'battleship') startBattleship();
  }

  function startMemory(){
    const c = curChar();
    const view = document.createElement('div');
    view.className = 'view';
    view.id = 'v-memory';
    view.innerHTML = `
      <div class="page-head">
        <button class="page-back" id="memoryBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>🧠 记忆翻牌</h1>
      </div>
      <div class="memory-stats">
        <span>你：<b id="memMyPairs">0</b> 对</span>
        <span>${esc(c.name)}：<b id="memTheirPairs">0</b> 对</span>
        <span>步数：<b id="memMoves">0</b></span>
      </div>
      <div class="memory-turn-banner me" id="memTurnBanner">你的回合</div>
      <div class="page-body" style="display:flex;align-items:flex-start;justify-content:center;padding:8px 22px 32px">
        <div class="memory-board" id="memoryBoard"></div>
      </div>
      <div style="display:flex;justify-content:center;gap:14px;padding:14px">
        <button class="btn primary" id="memoryRestart">🔄 重新开始</button>
        <button class="btn" id="memoryBack2">‹ 返回列表</button>
      </div>`;
    $('#views').appendChild(view);
    view.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>{ if(v.id !== 'v-memory') v.classList.remove('active'); });

    const EMOJIS = ['🌸','🌙','✨','💙','🫂','☕','🎧','🌊'];
    let deck = [], flipped = [], myPairs = 0, theirPairs = 0, myTurn = true, moves = 0, locked = false, gameOver = false;

    function initDeck(){
      const pairs = [...EMOJIS, ...EMOJIS];
      for(let i = pairs.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pairs[i], pairs[j]] = [pairs[j], pairs[i]]; }
      deck = pairs.map((e, i)=>({ id: i, emoji: e, matched: false, flipped: false, seenByAI: false }));
    }
    initDeck();

    function updateBanner(){
      const el = $('#memTurnBanner');
      if(gameOver){
        el.textContent = myPairs > theirPairs ? '🏆 你获胜！' : (theirPairs > myPairs ? `${c.name} 获胜！` : '平局！');
        el.className = 'memory-turn-banner';
        return;
      }
      if(myTurn){ el.textContent = '你的回合'; el.className = 'memory-turn-banner me'; }
      else { el.textContent = `${c.name} 的回合…`; el.className = 'memory-turn-banner them'; }
    }

    function renderBoard(){
      const boardEl = $('#memoryBoard');
      boardEl.innerHTML = deck.map((card, i)=>{
        let cls = 'memory-cell';
        if(card.matched) cls += ' matched';
        else if(card.flipped) cls += ' flipped';
        if(card.flipped || card.matched){
          return `<div class="${cls}" data-i="${i}"><span class="mc-front">${card.emoji}</span></div>`;
        }
        return `<div class="${cls}" data-i="${i}"><span class="mc-back">?</span></div>`;
      }).join('');
      boardEl.querySelectorAll('.memory-cell').forEach(el=>{
        el.onclick = ()=> clickCard(parseInt(el.dataset.i, 10));
      });
      $('#memMyPairs').textContent = myPairs;
      $('#memTheirPairs').textContent = theirPairs;
      $('#memMoves').textContent = moves;
      updateBanner();
    }
    renderBoard();

    function checkEnd(){
      if(myPairs + theirPairs === 8){
        gameOver = true;
        renderBoard();
        setTimeout(()=>{
          const win = myPairs > theirPairs;
          const msg = win ? `你赢了！你 ${myPairs} 对 vs TA ${theirPairs} 对` : (theirPairs > myPairs ? `TA赢了 ${theirPairs} 对 vs 你 ${myPairs} 对` : `平局！各 ${myPairs} 对`);
          toast('🎉 ' + msg);
          pushMsg({ id:uid(), from:'me', type:'text', text:`记忆翻牌结束：${msg}`, ts:Date.now() }, true);
        }, 500);
        return true;
      }
      return false;
    }

    function clickCard(i){
      if(!myTurn || locked || gameOver) return;
      const card = deck[i];
      if(card.matched || card.flipped) return;
      card.flipped = true;
      card.seenByAI = true;
      flipped.push(i);
      renderBoard();
      if(flipped.length === 2){
        moves++;
        $('#memMoves').textContent = moves;
        locked = true;
        const [a, b] = flipped;
        if(deck[a].emoji === deck[b].emoji){
          deck[a].matched = true; deck[b].matched = true;
          myPairs++;
          flipped = [];
          renderBoard();
          locked = false;
          if(checkEnd()) return;
          toast('配对成功！继续');
        } else {
          setTimeout(()=>{
            deck[a].flipped = false; deck[b].flipped = false;
            flipped = []; locked = false;
            myTurn = false;
            renderBoard();
            setTimeout(()=> aiTurn(), 900);
          }, 900);
        }
      }
    }

    function aiTurn(){
      if(gameOver) return;
      const seenPool = {};
      deck.forEach((card, i)=>{
        if(card.matched || !card.seenByAI) return;
        seenPool[card.emoji] = seenPool[card.emoji] || [];
        seenPool[card.emoji].push(i);
      });
      let pick1 = -1, pick2 = -1;
      for(const emoji in seenPool){
        const arr = seenPool[emoji].filter(i => !deck[i].matched && !deck[i].flipped);
        if(arr.length >= 2){ pick1 = arr[0]; pick2 = arr[1]; break; }
      }
      if(pick1 === -1){
        for(const emoji in seenPool){
          const arr = seenPool[emoji].filter(i => !deck[i].matched && !deck[i].flipped);
          if(arr.length === 1){ pick1 = arr[0]; break; }
        }
      }
      if(pick1 === -1 || pick2 === -1){
        const unseen = deck.map((card, i)=>({card, i})).filter(x => !x.card.matched && !x.card.flipped && !x.card.seenByAI);
        const unflipped = deck.map((card, i)=>({card, i})).filter(x => !x.card.matched && !x.card.flipped);
        const source = unseen.length ? unseen : unflipped;
        if(source.length < 2) return;
        for(let i = source.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [source[i], source[j]] = [source[j], source[i]]; }
        if(pick1 === -1) pick1 = source[0].i;
        if(pick2 === -1){
          for(const s of source){ if(s.i !== pick1){ pick2 = s.i; break; } }
        }
      }
      if(pick1 === -1 || pick2 === -1 || pick1 === pick2) return;
      deck[pick1].flipped = true;
      deck[pick1].seenByAI = true;
      renderBoard();
      setTimeout(()=>{
        deck[pick2].flipped = true;
        deck[pick2].seenByAI = true;
        renderBoard();
        setTimeout(()=>{
          if(deck[pick1].emoji === deck[pick2].emoji){
            deck[pick1].matched = true;
            deck[pick2].matched = true;
            theirPairs++;
            renderBoard();
            if(checkEnd()) return;
            setTimeout(()=> aiTurn(), 700);
          } else {
            setTimeout(()=>{
              deck[pick1].flipped = false;
              deck[pick2].flipped = false;
              renderBoard();
              myTurn = true;
              updateBanner();
            }, 900);
          }
        }, 700);
      }, 500);
    }

    function restart(){
      initDeck(); flipped = []; myPairs = 0; theirPairs = 0; moves = 0; myTurn = true; locked = false; gameOver = false;
      renderBoard();
    }
    $('#memoryRestart').onclick = restart;
    const backFn = ()=>{ view.remove(); switchTab('companion'); RENDERERS.companion(); };
    $('#memoryBack').onclick = backFn;
    $('#memoryBack2').onclick = backFn;
  }

  function startBattleship(){
    const c = curChar();
    const view = document.createElement('div');
    view.className = 'view';
    view.id = 'v-battleship';
    view.innerHTML = `
      <div class="page-head">
        <button class="page-back" id="bsBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>🚢 海战棋</h1>
      </div>
      <div class="bs-wrap" id="bsWrap"></div>`;
    $('#views').appendChild(view);
    view.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>{ if(v.id !== 'v-battleship') v.classList.remove('active'); });

    const SIZE = 10;
    const FLEET = [
      { name:'航母', size:5, ico:'🚢' },
      { name:'战列舰', size:4, ico:'🚢' },
      { name:'巡洋舰', size:3, ico:'🚢' },
      { name:'潜艇', size:3, ico:'🚤' },
      { name:'驱逐舰', size:2, ico:'⛵' }
    ];

    let myBoard = [];
    let enemyRealBoard = [];
    let enemyVisibleBoard = [];
    let aiKnownBoard = [];
    let myShips = [], enemyShips = [];
    let phase = 'place';
    let myTurn = true;
    let currentShipIdx = null;
    let currentRotation = 'h';
    let lastEnemyHit = null;

    function resetBoards(){
      myBoard = Array.from({length: SIZE}, ()=>Array(SIZE).fill(null));
      enemyRealBoard = Array.from({length: SIZE}, ()=>Array(SIZE).fill(null));
      enemyVisibleBoard = Array.from({length: SIZE}, ()=>Array(SIZE).fill(null));
      aiKnownBoard = Array.from({length: SIZE}, ()=>Array(SIZE).fill(null));
      myShips = []; enemyShips = []; lastEnemyHit = null;
      phase = 'place'; myTurn = true; currentShipIdx = null; currentRotation = 'h';
    }
    resetBoards();

    function render(){
      const wrap = $('#bsWrap');
      if(phase === 'place'){
        wrap.innerHTML = `
          <div class="bs-section-title">选择战舰 → 点击你的海域摆放（旋转切方向）</div>
          <div class="bs-ships" id="bsShips"></div>
          <div class="bs-section-title">你的海域</div>
          <div class="bs-grid" id="bsMyGrid"></div>
          <div style="display:flex;gap:10px;justify-content:center;padding:14px 0;flex-wrap:wrap">
            <button class="bs-ship-btn" id="bsRotate">↻ 旋转（${currentRotation === 'h' ? '横' : '竖'}）</button>
            <button class="bs-ship-btn" id="bsReady">✅ 准备完毕</button>
            <button class="bs-ship-btn" id="bsReset">🔄 重新摆船</button>
            <button class="bs-ship-btn" id="bsBack">‹ 返回</button>
          </div>`;
        renderShips();
        renderGrid('my');
        bindPlaceEvents();
      } else {
        const enemySunkCount = myShips.filter(s => s.hits >= s.cells.length).length;
        wrap.innerHTML = `
          <div class="bs-turn-banner ${phase==='over' ? (enemySunkCount === myShips.length ? 'win' : 'lose') : (myTurn ? 'me' : 'them')}" id="bsTurnBanner">
            ${phase === 'over'
              ? (enemySunkCount === myShips.length ? '🏆 你获胜！' : '💔 你的舰队被击沉了…')
              : (myTurn ? '开战！你的回合，点击 TA 的海域开炮' : `${c.name} 正在攻击…`)}
          </div>
          <div class="bs-log" id="bsLog">${phase === 'over' ? '对局结束' : ''}</div>
          <div class="bs-section-title">你的海域</div>
          <div class="bs-grid" id="bsMyGrid"></div>
          <div class="bs-section-title enemy-title">${esc(c.name)}的海域（点击攻击）</div>
          <div class="bs-grid" id="bsEnemyGrid"></div>
          <div style="display:flex;justify-content:center;padding:14px 0">
            <button class="bs-ship-btn" id="bsBack">‹ 返回列表</button>
          </div>`;
        renderGrid('enemy');
        renderGrid('my');
        $('#bsBack').onclick = backFn;
      }
    }

    function renderShips(){
      const el = $('#bsShips');
      if(!el) return;
      const placed = myShips.map(s => s.idx);
      el.innerHTML = FLEET.map((s, i)=>{
        const isPlaced = placed.includes(i);
        const isSelected = currentShipIdx === i;
        return `<button class="bs-ship-btn ${isPlaced?'placed':''} ${isSelected?'selected':''}" data-ship="${i}" ${isPlaced?'disabled':''}>
          ${s.ico} ${s.name}（${s.size}格）
        </button>`;
      }).join('');
      el.querySelectorAll('[data-ship]').forEach(btn=>{
        btn.onclick = ()=>{
          if(phase !== 'place') return;
          const idx = parseInt(btn.dataset.ship, 10);
          if(myShips.some(s => s.idx === idx)) return;
          currentShipIdx = idx;
          renderShips();
        };
      });
    }

    function renderGrid(which){
      const el = which === 'my' ? $('#bsMyGrid') : $('#bsEnemyGrid');
      if(!el) return;
      const board = which === 'my' ? myBoard : enemyVisibleBoard;
      let html = '';
      for(let r = 0; r < SIZE; r++){
        for(let cc = 0; cc < SIZE; cc++){
          const cell = board[r][cc];
          let cls = 'bs-cell';
          if(cell === 'ship') cls += ' ship';
          else if(cell === 'hit') cls += ' hit';
          else if(cell === 'miss') cls += ' miss';
          html += `<div class="${cls}" data-r="${r}" data-c="${cc}"></div>`;
        }
      }
      el.innerHTML = html;
      el.querySelectorAll('.bs-cell').forEach(cellEl=>{
        const r = parseInt(cellEl.dataset.r, 10);
        const cc = parseInt(cellEl.dataset.c, 10);
        if(which === 'my'){
          cellEl.onclick = ()=> handlePlaceClick(r, cc);
        } else {
          cellEl.onclick = ()=> handleAttackClick(r, cc);
        }
      });
    }

    function canPlace(board, r, c, size, rot){
      for(let i = 0; i < size; i++){
        const nr = rot === 'h' ? r : r + i;
        const nc = rot === 'h' ? c + i : c;
        if(nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return false;
        if(board[nr][nc] !== null) return false;
      }
      for(let i = 0; i < size; i++){
        const nr = rot === 'h' ? r : r + i;
        const nc = rot === 'h' ? c + i : c;
        for(let dr = -1; dr <= 1; dr++){
          for(let dc = -1; dc <= 1; dc++){
            const ar = nr + dr, ac = nc + dc;
            if(ar < 0 || ar >= SIZE || ac < 0 || ac >= SIZE) continue;
            if(board[ar][ac] !== null) return false;
          }
        }
      }
      return true;
    }

    function handlePlaceClick(r, c){
      if(phase !== 'place' || currentShipIdx === null) return;
      const ship = FLEET[currentShipIdx];
      if(myShips.some(s => s.idx === currentShipIdx)) return;
      if(!canPlace(myBoard, r, c, ship.size, currentRotation)){
        toast('这里放不下这艘船');
        return;
      }
      const cells = [];
      for(let i = 0; i < ship.size; i++){
        const nr = currentRotation === 'h' ? r : r + i;
        const nc = currentRotation === 'h' ? c + i : c;
        myBoard[nr][nc] = 'ship';
        cells.push([nr, nc]);
      }
      myShips.push({ idx: currentShipIdx, cells, hits: 0 });
      currentShipIdx = null;
      renderShips();
      renderGrid('my');
    }

    function bindPlaceEvents(){
      const rotateBtn = $('#bsRotate');
      if(rotateBtn) rotateBtn.onclick = ()=>{ currentRotation = currentRotation === 'h' ? 'v' : 'h'; render(); };
      const readyBtn = $('#bsReady');
      if(readyBtn) readyBtn.onclick = startBattle;
      const resetBtn = $('#bsReset');
      if(resetBtn) resetBtn.onclick = ()=>{ resetBoards(); render(); };
      const backBtn = $('#bsBack');
      if(backBtn) backBtn.onclick = backFn;
    }

    function placeEnemyShips(){
      enemyRealBoard = Array.from({length: SIZE}, ()=>Array(SIZE).fill(null));
      enemyShips = [];
      FLEET.forEach((s, idx)=>{
        let placed = false;
        let attempts = 0;
        while(!placed && attempts < 500){
          attempts++;
          const rot = Math.random() < 0.5 ? 'h' : 'v';
          const r = Math.floor(Math.random() * SIZE);
          const c = Math.floor(Math.random() * SIZE);
          if(canPlace(enemyRealBoard, r, c, s.size, rot)){
            const cells = [];
            for(let i = 0; i < s.size; i++){
              const nr = rot === 'h' ? r : r + i;
              const nc = rot === 'h' ? c + i : c;
              enemyRealBoard[nr][nc] = 'ship';
              cells.push([nr, nc]);
            }
            enemyShips.push({ idx, cells, hits: 0 });
            placed = true;
          }
        }
      });
    }

    function startBattle(){
      if(myShips.length < FLEET.length){ toast('请先摆放全部 5 艘战舰'); return; }
      placeEnemyShips();
      phase = 'battle';
      myTurn = Math.random() < 0.5;
      render();
      if(!myTurn){
        updateBattleUI();
        setTimeout(()=> aiAttack(), 1200);
      } else {
        updateBattleUI();
        toast('你先手，点击TA的海域');
      }
    }

    function updateBattleUI(){
      const banner = $('#bsTurnBanner');
      if(banner && phase !== 'over'){
        banner.textContent = myTurn ? '开战！你的回合，点击 TA 的海域开炮' : `${c.name} 正在攻击…`;
        banner.className = 'bs-turn-banner ' + (myTurn ? 'me' : 'them');
      }
    }

    function log(msg){
      const el = $('#bsLog');
      if(el) el.innerHTML = msg;
    }

    function handleAttackClick(r, cc){
      if(phase !== 'battle' || !myTurn) return;
      const vis = enemyVisibleBoard[r][cc];
      if(vis === 'hit' || vis === 'miss') return;
      if(enemyRealBoard[r][cc] === 'ship'){
        enemyVisibleBoard[r][cc] = 'hit';
        const ship = enemyShips.find(s => s.cells.some(([sr, sc]) => sr === r && sc === cc));
        if(ship){
          ship.hits++;
          if(ship.hits >= ship.cells.length){
            const f = FLEET[ship.idx];
            log(`🎯 击中并击沉了对方的 <b>${f.name}</b>！`);
            toast(`击沉 ${f.name}！`);
          } else {
            log('🎯 命中！');
            toast('命中！');
          }
        }
      } else {
        enemyVisibleBoard[r][cc] = 'miss';
        log('未命中');
        toast('未命中');
      }
      renderGrid('enemy');
      if(enemyShips.every(s => s.hits >= s.cells.length)){
        phase = 'over';
        render();
        setTimeout(()=>{
          toast('🎉 你击沉了对方全部舰队，获胜！');
          pushMsg({ id:uid(), from:'me', type:'text', text:'海战棋对局：你击沉了对方全部舰队，获胜！🎉', ts:Date.now() }, true);
        }, 300);
        return;
      }
      myTurn = false;
      updateBattleUI();
      setTimeout(()=> aiAttack(), 1000);
    }

    function aiAttack(){
      if(phase !== 'battle') return;
      const candidates = [];
      for(let r = 0; r < SIZE; r++){
        for(let cc = 0; cc < SIZE; cc++){
          if(aiKnownBoard[r][cc] !== null) continue;
          let w = 1;
          if(lastEnemyHit){
            const [lr, lc] = lastEnemyHit;
            const dist = Math.abs(r - lr) + Math.abs(cc - lc);
            if(dist === 1) w += 20;
            else if(dist === 2) w += 3;
          }
          candidates.push({ r, c: cc, w });
        }
      }
      if(!candidates.length) return;
      const totalW = candidates.reduce((s, t)=> s + t.w, 0);
      let pick = Math.random() * totalW;
      let chosen = candidates[0];
      for(const t of candidates){ pick -= t.w; if(pick <= 0){ chosen = t; break; } }
      const { r, c: cc } = chosen;
      if(myBoard[r][cc] === 'ship'){
        myBoard[r][cc] = 'hit';
        aiKnownBoard[r][cc] = 'hit';
        const ship = myShips.find(s => s.cells.some(([sr, sc]) => sr === r && sc === cc));
        if(ship){
          ship.hits++;
          if(ship.hits >= ship.cells.length){
            const f = FLEET[ship.idx];
            log(`💥 你的 <b>${f.name}</b> 被击沉了！`);
            toast(`你的 ${f.name} 被击沉`);
            lastEnemyHit = null;
          } else {
            log(`${c.name} 命中！`);
            toast(`${c.name} 命中你的船`);
            lastEnemyHit = [r, cc];
          }
        }
      } else {
        myBoard[r][cc] = 'miss';
        aiKnownBoard[r][cc] = 'miss';
        log(`${c.name} 未命中`);
        toast(`${c.name} 未命中`);
        lastEnemyHit = null;
      }
      renderGrid('my');
      if(myShips.every(s => s.hits >= s.cells.length)){
        phase = 'over';
        render();
        setTimeout(()=>{
          toast('😢 你的舰队被全歼了…');

        return;
      }
      myTurn = true;
      updateBattleUI();
    }

    const backFn = ()=>{ view.remove(); switchTab('companion'); RENDERERS.companion(); };
    render();

  function openCardsManage(){
    const c = curChar();
    let batchMode = false, selected = new Set(), currentGroup = '__all__', searchTerm = '';

    function render(body){
      const allGroups = new Set(['基础字卡']);
      c.cards.forEach(card => allGroups.add(card.group || '未分组'));
      (c.customGroups || []).forEach(g => allGroups.add(g));
      const groupNames = Array.from(allGroups).sort((a,b)=> a === '基础字卡' ? -1 : b === '基础字卡' ? 1 : a.localeCompare(b));
      const groupCounts = {};
      groupNames.forEach(g => { groupCounts[g] = 0; });
      c.cards.forEach(card => { const g = card.group || '未分组'; groupCounts[g] = (groupCounts[g] || 0) + 1; });
      const tabs = [{ id:'__all__', name:'全部', cnt: c.cards.length }].concat(groupNames.map(g=>({ id:g, name:g, cnt: groupCounts[g] || 0 })));
      let list = c.cards;
      if(currentGroup !== '__all__') list = list.filter(x=>(x.group||'未分组') === currentGroup);
      if(searchTerm) list = list.filter(x=>x.text.includes(searchTerm));

      body.innerHTML = `
        <div class="card-tabs" id="cardTabs">
          ${tabs.map(t=>`<button class="card-tab ${t.id===currentGroup?'active':''}" data-g="${esc(t.id)}">${esc(t.name)}<span class="cnt">${t.cnt}</span></button>`).join('')}

              const text = String(ev.target.result||'').replace(/^\uFEFF/, '');
              const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
              if(!lines.length){ toast('文件为空'); fileInput.value=''; return; }
              const added = [];
              let groupName = currentGroup === '__all__' ? '未分组' : currentGroup;
              lines.forEach(function(l){
                if(/^(---|##)/.test(l)){
                  groupName = l.replace(/^(---|##)\s*/,'').trim() || '未分组';
                  if(!Array.isArray(S.userCardGroups)) S.userCardGroups = [];
                  if(!S.userCardGroups.includes(groupName) && groupName !== '未分组' && groupName !== '默认') S.userCardGroups.push(groupName);
                  return;
                }
                const clean = l.replace(/^[-*·]\s*/,'').replace(/^\d+[.、]\s*/,'').trim();
                if(clean){ added.push({ id:uid(), text:clean, group:groupName }); }
              });
              if(!added.length){ toast('没有可导入的字卡'); fileInput.value=''; return; }
              S.userCards = S.userCards.concat(added);
              saveNow(); render(body); toast('已导入 ' + added.length + ' 条');
            }catch(err){ toast('文件读取失败'); }
            fileInput.value = '';
          };
          reader.onerror = function(){ toast('读取文件出错'); fileInput.value = ''; };
          reader.readAsText(f, 'UTF-8');
        });
      }

      body.querySelector('#dedupe').onclick = ()=>{
        const seen = new Set(), kept = []; let removed = 0;
        S.userCards.forEach(card=>{
          const key = (card.text||'').trim();
          if(!key) return;
          if(seen.has(key)) removed++;
          else { seen.add(key); kept.push(card); }
        });
        if(removed === 0){ toast('没有重复字卡'); return; }
        if(!confirm(`发现 ${removed} 条重复字卡，只保留一条？`)) return;
        S.userCards = kept; saveNow(); render(body); toast(`已删除 ${removed} 条重复`);
      };

      body.querySelectorAll('[data-id]').forEach(el=>{
        const id = el.dataset.id;
        if(batchMode){
          el.onclick = ()=>{ if(selected.has(id)) selected.delete(id); else selected.add(id); render(body); };
        } else {
          el.querySelector('.copy').onclick = ()=>{ const card = S.userCards.find(x=>x.id===id); if(card && navigator.clipboard) navigator.clipboard.writeText(card.text); toast('已复制'); };
          el.querySelector('.edit').onclick = ()=>{
            const card = S.userCards.find(x=>x.id===id); if(!card) return;
            const allGroups = ['默认','未分组'].concat((S.userCardGroups||[]).filter(g=>g!=='默认' && g!=='未分组'));
            openSheet('编辑字卡', `
              <div class="field"><label>字卡内容</label><textarea class="textarea" id="edTxt" style="min-height:100px">${esc(card.text)}</textarea></div>
              <div class="field"><label>分组</label>
                <select id="edGrp" style="width:100%;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-btn);padding:11px 14px;font:inherit;font-size:14.5px;color:var(--text);outline:none;font-family:var(--app-font)">
                  ${Array.from(new Set(allGroups)).map(g=>`<option ${card.group===g?'selected':''}>${esc(g)}</option>`).join('')}
                </select>
              </div>
              <div class="btn-row"><button class="btn danger" id="edDel">删除</button><button class="btn primary" id="edSave" style="margin-left:auto">保存</button></div>`, b2=>{
              b2.querySelector('#edSave').onclick = ()=>{ card.text = b2.querySelector('#edTxt').value.trim() || card.text; card.group = b2.querySelector('#edGrp').value || '未分组'; saveNow(); closeSheet(); render(body); toast('已保存'); };
              b2.querySelector('#edDel').onclick = ()=>{ S.userCards = S.userCards.filter(x=>x.id!==id); saveNow(); closeSheet(); render(body); toast('已删除'); };
            });
          };
          el.querySelector('.del').onclick = ()=>{ S.userCards = S.userCards.filter(x=>x.id!==id); saveNow(); render(body); toast('已删除'); };
        }
      });
    }

    openSheet('我的字卡', '<div id="myCardsRoot"></div>', body=>{ render(body.querySelector('#myCardsRoot')); });
  }

                cv.getContext('2d').drawImage(img, 0, 0, w, h);

          if(!added){ toast('没有新增'); return; }

  function openExport(){
    const sizeMB = (()=>{ try{ const json = JSON.stringify(S); return (new Blob([json]).size / 1024 / 1024).toFixed(2); }catch(e){ return '?'; } })();
    openSheet('导出 / 导入数据', `
      <div class="imp-info">使用 <b>IndexedDB</b> 存储。<br>当前数据约 <b>${sizeMB} MB</b></div>
      <div class="card"><div class="card-title">📤 导出到文件</div><div class="muted" style="margin-bottom:16px">保存为 .json 文件</div><button class="btn primary" id="expFile" style="width:100%">导出为文件</button></div>
      <div class="card"><div class="card-title">📥 从文件导入</div><div class="muted" style="margin-bottom:16px">选择之前导出的 .json 文件</div><label class="btn" style="width:100%;display:block;text-align:center;cursor:pointer">选择 JSON 文件<input type="file" id="impFile" accept=".json,application/json,text/plain" style="display:none"></label></div>
      <div class="card"><div class="card-title">📋 剪贴板</div><div class="btn-row"><button class="btn" id="expClip" style="flex:1">复制 JSON</button><button class="btn" id="impClip" style="flex:1">从剪贴板导入</button></div></div>`, body=>{
      body.querySelector('#expFile').onclick = function(){
        try{
          const data = JSON.stringify(S);
          const blob = new Blob([data], {type:'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = 'whisper-backup-' + Date.now() + '.json';
          document.body.appendChild(a); a.click();
          setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} if(a.parentNode) a.parentNode.removeChild(a); }, 2000);
          toast('已导出（' + (blob.size / 1024 / 1024).toFixed(2) + ' MB）');
        }catch(e){ console.error('导出错误:', e); toast('导出失败'); }
      };
      const fileInput = body.querySelector('#impFile');
      fileInput.addEventListener('change', function(){
        const f = fileInput.files && fileInput.files[0]; if(!f) return;
        toast('正在读取文件…');
        const reader = new FileReader();
        reader.onload = function(ev){
          try{
            let text;
            const buffer = ev.target.result, bytes = new Uint8Array(buffer);
            if(bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) text = new TextDecoder('utf-8').decode(bytes.subarray(3));
            else if(bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) text = new TextDecoder('utf-16le').decode(bytes.subarray(2));
            else text = new TextDecoder('utf-8').decode(bytes);
            text = text.replace(/\uFEFF/g, '').trim();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch(e1){
              const first = text.indexOf('{'), last = text.lastIndexOf('}');
              if(first >= 0 && last > first) parsed = JSON.parse(text.substring(first, last + 1));
              else throw new Error('没有找到 JSON 对象');
            }
            if(!parsed || typeof parsed !== 'object') throw new Error('内容不是有效的对象');
            if(!parsed.chars && !parsed.user) throw new Error('缺少必要字段');
            if(!confirm('确定导入并覆盖当前数据？')){ fileInput.value = ''; return; }
            S = migrate(parsed);
            dbSet(S).then(()=>{ toast('导入成功！正在刷新…'); setTimeout(()=>location.reload(), 900); }).catch(err=>{ alert('写入数据失败：' + (err.message || '未知错误')); fileInput.value = ''; });
          }catch(err){ console.error('导入解析失败:', err); alert('导入失败：' + (err.message || '未知错误')); fileInput.value = ''; }
        };
        reader.onerror = function(){ toast('读取文件出错'); fileInput.value = ''; };
        reader.readAsArrayBuffer(f);
      });
      body.querySelector('#expClip').onclick = function(){
        const data = JSON.stringify(S);
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(()=>toast('已复制')).catch(()=>fallbackCopy(data));
        else fallbackCopy(data);
        function fallbackCopy(t){ const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); } document.body.removeChild(ta); }
      };
      body.querySelector('#impClip').onclick = async function(){
        try{
          if(!navigator.clipboard || !navigator.clipboard.readText){ toast('浏览器不支持'); return; }
          const txt = await navigator.clipboard.readText();
          let parsed = null;
          try { parsed = JSON.parse(txt); } catch(e){
            const first = txt.indexOf('{'), last = txt.lastIndexOf('}');
            if(first >= 0 && last > first) parsed = JSON.parse(txt.substring(first, last + 1));
            else throw new Error('格式错误');
          }
          if(!parsed.chars && !parsed.user){ toast('缺少必要字段'); return; }
          if(!confirm('确定导入并覆盖当前数据？')) return;
          S = migrate(parsed);
          await dbSet(S);
          toast('导入成功！正在刷新…');
          setTimeout(()=>location.reload(), 900);
        }catch(e){ alert('导入失败：' + (e.message || '未知错误')); }
      };
    });
  }

  function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  RENDERERS.period = function(){
    const body = $('#periodBody');
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1);
    const days = new Date(y, m+1, 0).getDate();
    const startPad = first.getDay();
    const marks = {};
    (S.period.records || []).forEach(r=>{
      if(!r.start) return;
      const s = new Date(r.start + 'T00:00:00');
      const e = r.end ? new Date(r.end + 'T00:00:00') : new Date(s.getTime() + (S.period.duration-1)*86400000);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)){
        const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        marks[key] = (key === r.start) ? 'start' : 'during';
      }
    });
    let cells = '';
    for(let i = 0; i < startPad; i++) cells += '<div></div>';
    for(let d = 1; d <= days; d++){
      const ds = `${y}-${pad(m+1)}-${pad(d)}`;
      const isFuture = new Date(y, m, d) > now;
      cells += `<div class="d ${marks[ds]||''} ${ds===todayStr()?'today':''} ${isFuture?'future':''}" data-d="${ds}">${d}</div>`;
    }
    const list = (S.period.records || []).slice().sort((a,b)=> (b.start||'').localeCompare(a.start||''));
    let avgCycle = S.period.cycle || 28;
    if(list.length >= 2){
      let sum = 0, cnt = 0;
      for(let i = 0; i < list.length - 1; i++){
        if(!list[i].start || !list[i+1].start) continue;
        const diff = (new Date(list[i].start) - new Date(list[i+1].start)) / 86400000;
        if(diff > 15 && diff < 60){ sum += diff; cnt++; }
      }
      if(cnt) avgCycle = Math.round(sum/cnt);
    }
    S.period.cycle = avgCycle; saveNow();
    const next = calcNextPeriod();
    const nextStr = next ? (next.daysLeft === 0 ? '就是今天' : `还有 ${next.daysLeft} 天（${next.dateStr}）`) : '暂无记录';
    body.innerHTML = `
      <div class="muted" style="margin-bottom:14px">${y} 年 ${m+1} 月 · 点击日期记录</div>
      <div class="period-cal">${cells}</div>
      <div class="card" style="margin-top:14px">
        <div class="card-title">📊 周期分析</div>
        <div class="muted">平均周期：<b style="color:var(--text)">${avgCycle}</b> 天<br>经期长度：<b style="color:var(--text)">${S.period.duration}</b> 天<br>已记录：<b style="color:var(--text)">${list.length}</b> 次<br>下次预计：<b style="color:var(--text)">${nextStr}</b></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="periodStart">记录今天开始</button><button class="btn" id="periodEnd">记录今天结束</button></div>
      <button class="btn danger" id="periodClear" style="width:100%;margin-top:14px">清空所有记录</button>`;
    body.querySelectorAll('[data-d]').forEach(el=>{
      el.onclick = ()=>{
        if(el.classList.contains('future')) return;
        const d = el.dataset.d;
        const idx = S.period.records.findIndex(r=>r.start === d);
        if(idx >= 0){
          if(!S.period.records[idx].end) S.period.records[idx].end = d;
          else if(S.period.records[idx].end === d) S.period.records[idx].end = '';
        } else S.period.records.push({ start: d, end: '' });
        saveNow(); RENDERERS.period(); renderHome();
      };
    });
    body.querySelector('#periodStart').onclick = ()=>{ const d = todayStr(); if(S.period.records.find(r=>r.start === d)){ toast('今天已记录'); return; } S.period.records.push({ start: d, end: '' }); saveNow(); RENDERERS.period(); renderHome(); toast('已记录开始'); };
    body.querySelector('#periodEnd').onclick = ()=>{ const d = todayStr(); const last = S.period.records.slice().reverse().find(r=>r.start && !r.end); if(!last){ toast('还没有未结束的记录'); return; } last.end = d; saveNow(); RENDERERS.period(); renderHome(); toast('已记录结束'); };
    body.querySelector('#periodClear').onclick = ()=>{ if(!confirm('清空所有经期记录？')) return; S.period.records = []; saveNow(); RENDERERS.period(); renderHome(); };
  };

      el.onclick = e=>{
        const i = parseInt(el.dataset.char,10);
        if(el.querySelector('.del')?.contains(e.target)){ c.avatarLibrary.splice(i,1); saveNow(); RENDERERS.avatars(); return; }
        c.avatar = c.avatarLibrary[i]; saveNow(); RENDERERS.avatars(); renderHome(); renderChat(); toast('已切换头像');
      };
    });
    body.querySelector('#charAdd').onclick = ()=> pickAvatar(data=>{ c.avatarLibrary.push(data); saveNow(); RENDERERS.avatars(); });
    const handleBatch = (id, arr) => {
      const inp = body.querySelector('#'+id);
      inp.addEventListener('change', function(){
        const files = Array.from(this.files || []); if(!files.length) return;
        let finished = 0;
        files.forEach(f=>{
          const r = new FileReader();
          r.onload = ev=>{
            const img = new Image();
            img.onload = ()=>{
              const MAX = 200;
              let w = img.naturalWidth, h = img.naturalHeight;
              if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
              const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
              cv.getContext('2d').drawImage(img, 0, 0, w, h);
              arr.push(cv.toDataURL('image/jpeg', 0.75));
              finished++; if(finished === files.length){ saveNow(); RENDERERS.avatars(); toast('已添加 ' + files.length + ' 张'); }
            };
            img.src = ev.target.result;
          };
          r.readAsDataURL(f);
        });
      });
    };
    handleBatch('myBatchUpload', S.user.avatarLibrary);
    handleBatch('charBatchUpload', c.avatarLibrary);
  };
  function pickAvatar(cb){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          const MAX = 200;
          let w = img.naturalWidth, h = img.naturalHeight;
          if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', 0.75));
        };
        img.src = ev.target.result;
      };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  RENDERERS.me = function(){
    const body = $('#meBody');
    const c = curChar();
    body.innerHTML = `
      <div style="display:flex;align-items:center;gap:16px;padding:12px 0 24px">
        ${avatarHTML(S.user, 'lg')}
        <div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:400;color:var(--text);letter-spacing:.02em">${esc(S.user.name)}</div><div style="font-size:13px;color:var(--sub);margin-top:6px;letter-spacing:.04em">${esc(S.user.sign||'')}</div></div>
        <button class="btn sm" id="editProfile">编辑</button>
      </div>
      <div style="font-size:15.5px;font-weight:400;color:var(--text);margin-bottom:12px;letter-spacing:.02em">🎭 角色管理 <span style="font-size:12px;color:var(--dim);font-weight:400;margin-left:6px">当前：${esc(c.name)}</span></div>
      <div id="charList" style="margin-bottom:22px"></div>
      <div class="list-row" data-m="my-cards"><span class="ico">✏️</span><span class="tt">我的字卡<div class="sub">共 ${S.userCards.length} 条 · 点聊天底部「选择字卡」使用</div></span><span class="arrow">›</span></div>
      <div class="list-row" data-m="cards"><span class="ico">🗂️</span><span class="tt">角色字卡管理<div class="sub">${esc(c.name)} 的素材库 · ${c.cards.length} 条 · ${(c.customGroups||[]).length} 个分组</div></span><span class="arrow">›</span></div>
      <div class="list-row" data-m="emoji"><span class="ico">😀</span><span class="tt">表情包管理<div class="sub">我的 ${c.systemEmojis.length + c.stickers.length} · TA 的 ${c.theirEmojis.length}</div></span><span class="arrow">›</span></div>
      <div class="list-row" data-m="avatars"><span class="ico">🖼️</span><span class="tt">头像库<div class="sub">我的 ${S.user.avatarLibrary.length} · TA 的 ${c.avatarLibrary.length}</div></span><span class="arrow">›</span></div>`;
    const cl = body.querySelector('#charList');
    cl.innerHTML = S.chars.map(ch=>`
      <div class="list-row" data-char="${ch.id}" style="${ch.id===S.current?'background:rgba(167,139,250,.12)':''}">
        ${avatarHTML(ch, 'sm')}
        <span class="tt">${esc(ch.name)}<div class="sub">${ch.id===S.current?'当前角色':'点击切换'}</div></span>
        ${S.chars.length>1 ? `<button class="btn sm" data-delchar="${ch.id}" style="pointer-events:auto">删除</button>` : ''}
      </div>`).join('') + `<button class="btn primary" id="addChar" style="width:100%;margin-top:8px">＋ 新建角色</button>`;
    cl.querySelectorAll('[data-char]').forEach(el=>{
      el.onclick = e=>{
        if(e.target.closest('[data-delchar]')) return;
        if(el.dataset.char === S.current) return;
        S.current = el.dataset.char;
        clearReplyTimers();
        saveNow(); renderHome(); renderChat(); RENDERERS.me();
        toast('已切换到 ' + curChar().name);
      };
    });
    cl.querySelectorAll('[data-delchar]').forEach(b=>{
      b.onclick = e=>{
        e.stopPropagation();
        if(S.chars.length <= 1) return;
        if(!confirm('删除该角色及其聊天记录？')) return;
        const id = b.dataset.delchar;
        S.chars = S.chars.filter(x=>x.id !== id);
        delete S.messages[id];
        if(S.current === id){ S.current = S.chars[0].id; clearReplyTimers(); }
        saveNow(); renderHome(); renderChat(); RENDERERS.me();
      };
    });
    const addBtn = cl.querySelector('#addChar');
    if(addBtn){
      addBtn.onclick = ()=>{
        const name = prompt('新角色昵称：', '萧逸'); if(!name) return;
        const id = 'c' + uid();
        const ch = newChar(id, name.trim());
        S.chars.push(ch); S.messages[id] = []; S.current = id;
        clearReplyTimers();
        saveNow(); renderHome(); renderChat(); RENDERERS.me();
        toast('已创建 ' + ch.name);
      };
    }
    body.querySelectorAll('[data-m]').forEach(el=>{
      el.onclick = ()=>{
        const m = el.dataset.m;
        if(m === 'my-cards') openMyCardsManage();
        else if(m === 'cards') openCardsManage();
        else if(m === 'emoji') openEmojisSetting();
        else if(m === 'avatars') switchTab('avatars');
      };
    });
    body.querySelector('#editProfile').onclick = editProfile;
  };
  function editProfile(){
    openSheet('编辑资料', `
      <div class="field"><label>昵称</label><input class="input" id="pfName" value="${esc(S.user.name)}"></div>
      <div class="field"><label>签名</label><input class="input" id="pfSign" value="${esc(S.user.sign||'')}"></div>
      <div class="field"><label>头像</label><input class="input" type="file" accept="image/*" id="pfAvatar" style="padding:10px;font-size:13px"></div>
      <button class="btn primary" id="pfSave" style="width:100%">保存</button>`, body=>{
      let data = '';
      body.querySelector('#pfAvatar').onchange = e=>{
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = ev=>{
          const img = new Image();
          img.onload = ()=>{
            const MAX = 200;
            let w = img.naturalWidth, h = img.naturalHeight;
            if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            data = cv.toDataURL('image/jpeg', 0.75);
          };
          img.src = ev.target.result;
        };
        r.readAsDataURL(f);
      };
      body.querySelector('#pfSave').onclick = ()=>{
        S.user.name = body.querySelector('#pfName').value.trim() || '欣';
        S.user.sign = body.querySelector('#pfSign').value.trim();
        if(data){ S.user.avatar = data; if(!S.user.avatarLibrary.includes(data)) S.user.avatarLibrary.push(data); }
        saveNow(); closeSheet(); renderHome(); RENDERERS.me(); toast('已保存');
      };
    });
  }

  const PROACTIVE_MIN_WAIT = 30 * 1000;
  function getLastTrigger(key){
    try{ return parseInt(localStorage.getItem('whisper-last-' + key) || '0', 10) || 0; }catch(e){ return 0; }
  }
  function setLastTrigger(key){ try{ localStorage.setItem('whisper-last-' + key, String(Date.now())); }catch(e){} }
  function calcDelay(key, minMin, maxMin, firstDelay){
    const minMs = Math.max(1, minMin) * 60000;
    const maxMs = Math.max(minMs, maxMin) * 60000;
    const last = getLastTrigger(key);
    if(!last){
      const grace = (10 + Math.random() * 20) * 60000;
      return Math.max(firstDelay || PROACTIVE_MIN_WAIT, grace);
    }
    const since = Date.now() - last;
    const waitMin = Math.max(0, minMs - since);
    const randomPart = Math.random() * (maxMs - minMs);
    return Math.max(firstDelay || PROACTIVE_MIN_WAIT, waitMin + randomPart);
  }

  let proactiveMomentTimer = null;
  function scheduleProactiveMoment(){
    clearTimeout(proactiveMomentTimer);
    const p = S.settings.momentsPost;
    if(!p || !p.enabled) return;
    const delay = calcDelay('moment', p.minMin || 60, p.maxMin || 240);
    proactiveMomentTimer = setTimeout(()=>{
      setLastTrigger('moment');
      doProactiveMoment();
      scheduleProactiveMoment();
    }, delay);
  }
  function doProactiveMoment(){
    const c = curChar();
    const text = pickCardsForCompose(randInt(2, 3));
    if(!text) return;
    S.moments.unshift({ id:uid(), who:'them', text, imgs:[], imgsData:[], likes:[], cmts:[], ts:Date.now() });
    saveNow();
    if(document.getElementById('v-moments').classList.contains('active')) RENDERERS.moments();
    if(S.settings.notifications !== false && document.hidden) sendNotification(c.name + ' 发了朋友圈', text.slice(0, 60));
  }

  let proactiveDiaryTimer = null;
  function scheduleProactiveDiary(){
    clearTimeout(proactiveDiaryTimer);
    const p = S.settings.diaryPost;
    if(!p || !p.enabled) return;
    const delay = calcDelay('diary', p.minMin || 240, p.maxMin || 480);
    proactiveDiaryTimer = setTimeout(()=>{
      setLastTrigger('diary');
      doProactiveDiary();
      scheduleProactiveDiary();
    }, delay);
  }
  function doProactiveDiary(){
    const c = curChar();
    const text = pickCardsForCompose(randInt(5, 6));
    if(!text) return;
    S.diaries.unshift({ id:uid(), who:'them', text, ts:Date.now() });
    saveNow();
    if(document.getElementById('v-diary').classList.contains('active')) RENDERERS.diary();
    if(S.settings.notifications !== false && document.hidden) sendNotification(c.name + ' 写了日记', text.slice(0, 60));
  }

  let proactiveLetterTimer = null;
  function scheduleProactiveLetter(){
    clearTimeout(proactiveLetterTimer);
    const p = S.settings.letterPost;
    if(!p || !p.enabled) return;
    const delay = calcDelay('letter', p.minMin || 720, p.maxMin || 1440);
    proactiveLetterTimer = setTimeout(()=>{
      setLastTrigger('letter');
      doProactiveLetter();
      scheduleProactiveLetter();
    }, delay);
  }
  const LETTER_TITLES = ['一些杂念', '写给未来的你', '无题', '安静的夜', '午后', '闲话', '一点心情', '想到你', '随手记', '晚安'];
  function doProactiveLetter(){
    const c = curChar();
    const body = pickCardsForCompose(randInt(5, 6));
    if(!body) return;
    const title = rand(LETTER_TITLES);
    S.letters.unshift({ id:uid(), box:'inbox', title, body, star:false, read:false, ts:Date.now() });
    saveNow();
    if(document.getElementById('v-mail').classList.contains('active')) RENDERERS.mail();
    renderHome();
    if(S.settings.notifications !== false && document.hidden) sendNotification(c.name + ' 寄来一封信', title);
  }

  let proactiveRedpacketTimer = null;
  function scheduleProactiveRedpacket(){
    clearTimeout(proactiveRedpacketTimer);
    const p = S.settings.redpacketPost;
    if(!p || !p.enabled) return;
    const delay = calcDelay('redpacket', p.minMin || 120, p.maxMin || 480);
    proactiveRedpacketTimer = setTimeout(()=>{
      setLastTrigger('redpacket');
      doProactiveRedpacket();
      scheduleProactiveRedpacket();
    }, delay);
  }
  const RP_NOTES = ['给你的', '买点好吃的', '辛苦了', '小小心意', '请你喝奶茶', '开心一点', '记得吃饭', '随机红包', '今天也想对你好一点', '收着吧'];
  function doProactiveRedpacket(){
    const c = curChar();
    const rp = S.settings.redpacketPost;
    const minAmt = Math.max(50, rp.minAmount || 50);
    const maxAmt = Math.max(minAmt, rp.maxAmount || 10001);
    const amt = randFloat(minAmt, maxAmt).toFixed(2);
    const note = rand(RP_NOTES);
    const msg = { id:uid(), from:'them', type:'redpacket', amount:amt, text:note, ts:Date.now(), status:'pending' };
    pushMsg(msg, true);
    playSound(c.sound);
    if(S.settings.notifications !== false && document.hidden) sendNotification(c.name + ' 发来一个红包', `¥${amt} · ${note}`);
  }

  let proactiveCallTimer = null;
  function scheduleProactiveCall(){
    clearTimeout(proactiveCallTimer);
    const p = S.settings.callPost;
    if(!p || !p.enabled) return;
    const delay = calcDelay('call', p.minMin || 240, p.maxMin || 720, 60000);
    proactiveCallTimer = setTimeout(()=>{
      setLastTrigger('call');
      doProactiveCall();
      scheduleProactiveCall();
    }, delay);
  }
  function doProactiveCall(){
    if($('#callOverlay').classList.contains('show') || callMinimized) return;
    const c = curChar();
    if(S.settings.notifications !== false && document.hidden) sendNotification(c.name + ' 来电', '');
    playSound(c.sound);
    incomingCall();
  }

  setInterval(()=>{ if(document.getElementById('v-home').classList.contains('active')) renderHome(); }, 30000);

  refreshDailyRandom();
  renderHome();
  renderChat();
  RENDERERS.moments();
  RENDERERS.mail();
  RENDERERS.diary();
  RENDERERS.companion();
  RENDERERS.period();
  RENDERERS.avatars();
  RENDERERS.settings();
  RENDERERS.me();

  RENDERERS.chat = function(){
    try{ renderChat(); }catch(e){ console.error('RENDERERS.chat 失败:', e); }
  };

  autoResize();
  sendBtn.disabled = true;

  scheduleProactiveMoment();
  scheduleProactiveDiary();
  scheduleProactiveLetter();
  scheduleProactiveRedpacket();
  scheduleProactiveCall();

  const reqNotifOnce = ()=>{ requestNotifPermission(); document.body.removeEventListener('pointerdown', reqNotifOnce); };
  document.body.addEventListener('pointerdown', reqNotifOnce, { once: true });
}

boot().catch(err => {
  console.error('启动出错:', err);
  alert('启动出错：' + (err.message || '未知错误'));
});

})();
</script>
