<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7F7F8">
<title>Whisper · 陪伴</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&family=Caveat:wght@400;500&family=Long+Cang&family=Ma+Shan+Zheng&display=swap');

:root{
  --bg-page:#F7F7F8;
  --text:#4A4A4F;
  --sub:#8E8E93;
  --dim:#B8B8C0;
  --icon:#4A4A4F;
  --icon-hover:#1C1C1E;
  --line:rgba(120,130,160,.08);

  --star-violet:#A78BFA;
  --star-blue:#60A5FA;
  --star-warm:#D4B5B5;

  --glass-bg:rgba(255,255,255,.65);
  --glass-border:rgba(255,255,255,.8);
  --glass-blur:blur(10px) saturate(150%);
  --glass-shadow:
    0 1px 2px rgba(120,130,160,.04),
    0 4px 16px rgba(120,130,160,.05);
  --glass-shadow-hover:
    0 1px 2px rgba(120,130,160,.04),
    0 8px 24px rgba(120,130,160,.1),
    0 0 16px rgba(167,139,250,.15);

  --card:rgba(255,255,255,.7);
  --card-border:rgba(255,255,255,.8);
  --blue:#4A4A4F;
  --purple:#4A4A4F;
  --pink:#D4B5B5;

  --radius-card:18px;
  --radius-btn:12px;
  --radius-sm:9px;
  --radius-pill:999px;

  --app-font:"Kalam","Caveat","Long Cang","Ma Shan Zheng",
             "Hanzipen SC","Hannotate SC","STKaiti","KaiTi",
             -apple-system,BlinkMacSystemFont,"PingFang SC",
             "Hiragino Sans GB","Microsoft YaHei",cursive,sans-serif;

  --chat-font-size:16px;
  --fs-body:15px;
  --fs-title:20px;
  --lh-body:1.85;

  --t-fast:.3s cubic-bezier(.22,.61,.36,1);
  --t-slow:.6s cubic-bezier(.22,.61,.36,1);

  --my-bubble-bg:#F2F2F5;
  --my-bubble-color:#4A4A4F;
  --my-bubble-radius:8px;
  --my-bubble-border:1.5px dashed #4A4A4F;
  --my-bubble-shadow:2px 2px 0px rgba(74,74,79,.15);
  --my-bubble-padding:10px 14px;
  --my-bubble-max-width:72%;
  --my-bubble-deco:block;

  --their-bubble-bg:#F2F2F5;
  --their-bubble-color:#4A4A4F;
  --their-bubble-radius:8px;
  --their-bubble-border:1.5px dashed #4A4A4F;
  --their-bubble-shadow:2px 2px 0px rgba(74,74,79,.15);
  --their-bubble-padding:10px 14px;
  --their-bubble-max-width:72%;
  --their-bubble-deco:block;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

body{
  background:
    radial-gradient(ellipse 120% 100% at 0% 0%,
      rgba(167,139,250,.05) 0%, rgba(167,139,250,.02) 35%, transparent 65%),
    radial-gradient(ellipse 120% 100% at 100% 100%,
      rgba(96,165,250,.05) 0%, rgba(96,165,250,.02) 35%, transparent 65%),
    #F7F7F8;
  background-attachment:fixed;
  color:var(--text);
  overflow:hidden;
  font-family:var(--app-font);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  font-weight:400;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    radial-gradient(circle 2px at 15% 20%, rgba(255,255,255,.8) 0%, transparent 70%),
    radial-gradient(circle 1.5px at 85% 35%, rgba(255,255,255,.7) 0%, transparent 70%),
    radial-gradient(circle 2px at 65% 75%, rgba(255,255,255,.7) 0%, transparent 70%),
    radial-gradient(circle 1px at 10% 65%, rgba(255,255,255,.6) 0%, transparent 70%),
    radial-gradient(circle 1.5px at 40% 10%, rgba(255,255,255,.6) 0%, transparent 70%);
}
.stars-bg,.cloud{display:none!important}

.loading-mask{
  position:fixed;inset:0;z-index:9999;
  background:
    radial-gradient(ellipse 120% 100% at 0% 0%, rgba(167,139,250,.06), transparent 60%),
    radial-gradient(ellipse 120% 100% at 100% 100%, rgba(96,165,250,.06), transparent 60%),
    #F7F7F8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity var(--t-slow);
}
.loading-mask.hide{opacity:0;pointer-events:none}
.loading-mask .spinner{
  width:32px;height:32px;border-radius:50%;
  border:1.5px solid rgba(167,139,250,.15);
  border-top-color:var(--star-violet);
  animation:spin 1.1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-mask .txt{font-size:14px;color:var(--sub);letter-spacing:.1em}

.phone{
  position:relative;z-index:1;
  width:100%;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:transparent;
}
.views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.view.active{display:flex;animation:fadeUp var(--t-slow) both}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.home-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.home-scroll::-webkit-scrollbar{display:none}

.home-greeting{padding:6px 4px 14px;display:flex;align-items:center;justify-content:space-between}
.home-greeting .date{font-size:15px;color:var(--sub);font-weight:400;letter-spacing:.05em}

.blocks-row{display:flex;gap:12px;margin-bottom:14px}

.days-block{
  flex:1;
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  padding:20px;
  box-shadow:var(--glass-shadow);
  position:relative;overflow:hidden;
  transition:box-shadow var(--t-slow),border-color var(--t-slow);
}
.days-block:hover{border-color:rgba(167,139,250,.45);box-shadow:var(--glass-shadow-hover)}
.days-block .db-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-bottom:10px;letter-spacing:.05em}
.days-block .db-label .heart{color:var(--star-warm);font-size:13px}
.days-block .db-num{font-size:32px;font-weight:400;color:var(--text);line-height:1.15;letter-spacing:.02em}
.days-block .db-num small{font-size:14px;font-weight:400;color:var(--sub);margin-left:4px}
.days-block .db-date{font-size:11.5px;color:var(--dim);margin-top:8px;letter-spacing:.05em}

.today-say{
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--glass-shadow);
  transition:box-shadow var(--t-slow),border-color var(--t-slow);
}
.today-say:hover{border-color:rgba(96,165,250,.45);box-shadow:var(--glass-shadow-hover)}
.today-say .ts-top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-bottom:10px;letter-spacing:.06em}
.today-say .ts-top .heart{color:var(--star-warm);font-size:13px}
.today-say .ts-text{font-size:16px;font-weight:400;color:var(--text);line-height:1.85;letter-spacing:.02em}

.custom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;margin-bottom:18px}
.grid-icon{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform var(--t-fast);position:relative;user-select:none}
.grid-icon.drag-over{transform:scale(1.06);z-index:5}
.grid-icon.dragging{opacity:.4}
.grid-icon:active{transform:scale(.95)}
.grid-icon .ic-box{
  width:50px;height:50px;border-radius:16px;
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  display:grid;place-items:center;font-size:20px;
  box-shadow:var(--glass-shadow);
  transition:box-shadow var(--t-slow),transform var(--t-slow),border-color var(--t-slow);
  position:relative;
}
.grid-icon:hover .ic-box{box-shadow:var(--glass-shadow-hover);border-color:rgba(167,139,250,.5);transform:translateY(-2px)}
.grid-icon .ic-box .dot-red{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--star-warm);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 8px rgba(212,181,181,.6)}
.grid-icon .ic-lbl{font-size:12px;color:var(--sub);font-weight:400;letter-spacing:.05em;transition:color var(--t-fast)}
.grid-icon:hover .ic-lbl{color:var(--icon-hover)}
.grid-icon .edit-badge{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--icon);color:#fff;font-size:11px;display:none;place-items:center;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.edit-mode .grid-icon .edit-badge{display:grid}

.widget-grid{display:grid;grid-template-columns:1fr;gap:12px}
.widget{
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  padding:20px;
  box-shadow:var(--glass-shadow);
  display:flex;flex-direction:column;gap:10px;min-height:110px;
  transition:box-shadow var(--t-slow),border-color var(--t-slow);
}
.widget:hover{border-color:rgba(96,165,250,.45);box-shadow:var(--glass-shadow-hover)}
.widget .w-title{font-size:12.5px;color:var(--sub);text-align:center;letter-spacing:.08em}
.widget .w-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}

.chat-header{
  display:flex;align-items:center;gap:6px;padding:10px 14px;flex-shrink:0;
  background:rgba(247,247,248,.72);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;z-index:5;
  padding-top:calc(10px + env(safe-area-inset-top,0));
}
.chat-back,.chat-more{width:34px;height:34px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--icon);border-radius:50%;transition:color var(--t-fast),background var(--t-fast)}
.chat-back svg,.chat-more svg{stroke-width:1.5}
.chat-back:hover,.chat-more:hover{color:var(--icon-hover);background:rgba(255,255,255,.6)}
.chat-back:active,.chat-more:active{transform:scale(.92)}
.chat-title-wrap{flex:1;text-align:center;min-width:0}
.chat-title{font-size:18px;font-weight:400;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.chat-subtitle{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:0;transition:height var(--t-fast);letter-spacing:.05em}
.chat-subtitle.show{height:15px}
.chat-quick{font-size:17px;color:var(--icon);transition:color var(--t-fast)}
.chat-quick:hover{color:var(--star-violet)}

.avatar{
  position:relative;width:38px;height:38px;flex-shrink:0;
  border-radius:12px;
  background:rgba(240,240,245,.8) center/cover no-repeat;
  display:grid;place-items:center;
  font-weight:400;font-size:15px;color:var(--sub);
  cursor:pointer;overflow:hidden;
  transition:transform var(--t-fast);
  font-family:var(--app-font);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 2px rgba(120,130,160,.06);
}
.avatar.sm{width:34px;height:34px;font-size:13px;border-radius:11px}
.avatar.lg{width:56px;height:56px;font-size:20px;border-radius:16px}

.messages{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 8px;
  display:flex;flex-direction:column;
  scroll-behavior:smooth;
  background:transparent;
  background-size:cover;background-position:center;
  -webkit-overflow-scrolling:touch;
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(142,142,147,.15);border-radius:3px}

.sys-msg{
  align-self:center;font-size:11.5px;color:var(--sub);
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:6px 14px;border-radius:var(--radius-pill);
  margin:4px 0 12px;letter-spacing:.05em;
  border:1px solid rgba(255,255,255,.6);
}
.divider{
  align-self:center;font-size:10.5px;color:var(--dim);
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:4px 12px;border-radius:var(--radius-pill);
  margin:8px 0 14px;letter-spacing:.06em;
  border:1px solid rgba(255,255,255,.5);
}

.msg{display:flex;gap:8px;margin-bottom:16px;animation:pop var(--t-fast) both}
.msg.me{flex-direction:row-reverse}
@keyframes pop{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
.msg .body{display:flex;flex-direction:column;gap:4px}
.msg.them .body{max-width:min(var(--their-bubble-max-width,72%),480px)}
.msg.me .body{max-width:min(var(--my-bubble-max-width,72%),480px)}
.msg.me .body{align-items:flex-end}

.bubble{
  padding:var(--my-bubble-padding,10px 14px);
  border-radius:var(--my-bubble-radius,8px);
  font-size:var(--chat-font-size,16px);
  line-height:var(--lh-body);
  font-weight:400;
  letter-spacing:.02em;
  word-break:break-word;white-space:pre-wrap;
  position:relative;
  transition:box-shadow var(--t-slow);
}
.msg.them .bubble{
  background:var(--their-bubble-bg,#F2F2F5);
  color:var(--their-bubble-color,#4A4A4F);
  border:var(--their-bubble-border,1.5px dashed #4A4A4F);
  border-radius:var(--their-bubble-radius,8px);
  box-shadow:var(--their-bubble-shadow,2px 2px 0px rgba(74,74,79,.15));
  padding:var(--their-bubble-padding,10px 14px);
}
.msg.them .bubble::before{
  content:'☆';
  position:absolute;top:-14px;left:-8px;
  font-size:18px;color:currentColor;
  line-height:1;
  display:var(--their-bubble-deco,block);
}
.msg.them .bubble::after{
  content:'〰️';
  position:absolute;top:-12px;right:-10px;
  font-size:15px;color:currentColor;
  transform:rotate(30deg);
  line-height:1;
  display:var(--their-bubble-deco,block);
}
.msg.me .bubble{
  background:var(--my-bubble-bg,#F2F2F5);
  color:var(--my-bubble-color,#4A4A4F);
  border:var(--my-bubble-border,1.5px dashed #4A4A4F);
  border-radius:var(--my-bubble-radius,8px);
  box-shadow:var(--my-bubble-shadow,2px 2px 0px rgba(74,74,79,.15));
  padding:var(--my-bubble-padding,10px 14px);
}
.msg.me .bubble::before{
  content:'〰️';
  position:absolute;top:-12px;right:-10px;
  font-size:15px;color:currentColor;
  transform:rotate(-30deg);
  line-height:1;
  display:var(--my-bubble-deco,block);
}
.msg.me .bubble::after{
  content:'☆';
  position:absolute;bottom:-14px;right:-8px;
  font-size:18px;color:currentColor;
  line-height:1;
  display:var(--my-bubble-deco,block);
}

.time-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);padding:0 4px;letter-spacing:.06em}
.msg.me .time-row{justify-content:flex-end}
.read-mark{font-size:10.5px;color:var(--dim)}
.read-mark.read{color:var(--star-blue);opacity:.75}

.sticker-wrap{display:inline-block;line-height:0}
.sticker-wrap .sticker-emoji{font-size:24px;line-height:1;display:inline-block}
.sticker-wrap .sticker-img{width:66px;height:66px;object-fit:cover;border-radius:12px;display:block;box-shadow:0 2px 8px rgba(120,130,160,.1)}

.dice-box{
  background:var(--glass-bg);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.75);
  border-radius:14px;padding:10px 14px;display:grid;place-items:center;
  box-shadow:var(--glass-shadow);
}
.dice-num{font-size:30px;line-height:1;font-weight:400;color:var(--text)}

.redpacket{
  background:linear-gradient(155deg,rgba(255,255,255,.9),rgba(255,240,240,.85))!important;
  color:var(--text)!important;
  width:150px;padding:12px!important;
  cursor:pointer;border-radius:var(--radius-card)!important;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:4px;
  box-shadow:var(--glass-shadow)!important;
  border:1px solid rgba(255,255,255,.8)!important;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:transform var(--t-fast),box-shadow var(--t-slow),border-color var(--t-slow);
}
.redpacket:hover{transform:translateY(-2px);border-color:rgba(212,181,181,.6)!important;box-shadow:var(--glass-shadow-hover)!important}
.redpacket::before{display:none!important}
.redpacket::after{content:'';position:absolute;right:-16px;top:-16px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,rgba(212,181,181,.25),transparent 70%)}
.rp-top{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);letter-spacing:.06em}
.rp-ico{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--star-warm),#B89A9A);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:400}
.rp-amt{font-size:19px;font-weight:400;color:var(--text);letter-spacing:.02em;line-height:1.2;margin-top:2px}
.rp-note{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-status{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
.rp-done{opacity:.5}

.choice-card{
  background:var(--glass-bg);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:var(--radius-card);
  padding:16px;min-width:220px;max-width:280px;
  box-shadow:var(--glass-shadow);
  position:relative;
}
.msg.them .choice-card::before,
.msg.me .choice-card::before{display:none}
.choice-card-title{font-size:13px;font-weight:400;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.06em}
.choice-question{font-size:14.5px;color:var(--text);margin-bottom:12px;line-height:1.7}
.choice-options{display:flex;flex-direction:column;gap:8px}
.choice-opt{padding:9px 12px;border-radius:11px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);font-size:14px;color:var(--text);display:flex;align-items:center;gap:10px;transition:background var(--t-fast),border-color var(--t-fast)}
.choice-opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim);flex-shrink:0;display:grid;place-items:center;font-size:10px;color:var(--sub);font-weight:400;font-family:var(--app-font)}
.choice-opt.picked{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.35);color:var(--text)}
.choice-opt.picked .dot{background:var(--star-violet);border-color:var(--star-violet);color:#fff}

.quote{font-size:12px;line-height:1.6;border-left:2px solid rgba(167,139,250,.4);padding:3px 0 3px 9px;margin-bottom:6px;color:var(--sub);display:flex;align-items:center;gap:6px;overflow:hidden;max-height:34px}
.quote .quote-img{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.quote .quote-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll-bottom{
  position:absolute;right:14px;bottom:96px;
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--icon);
  display:grid;place-items:center;cursor:pointer;
  z-index:15;opacity:0;pointer-events:none;
  transition:opacity var(--t-fast),color var(--t-fast),transform var(--t-fast),box-shadow var(--t-slow);
  box-shadow:var(--glass-shadow);
}
.scroll-bottom svg{stroke-width:1.5}
.scroll-bottom.show{opacity:1;pointer-events:auto}
.scroll-bottom:hover{color:var(--star-violet);border-color:rgba(167,139,250,.5);box-shadow:var(--glass-shadow-hover)}
.scroll-bottom:active{transform:scale(.92)}

.quote-bar{display:none;align-items:center;gap:10px;padding:9px 14px;flex-shrink:0;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.7);font-size:12.5px}
.quote-bar.show{display:flex}
.quote-bar .qb-body{flex:1;min-width:0;border-left:2px solid var(--star-violet);padding-left:9px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.quote-bar .qb-img{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.quote-bar b{color:var(--text);margin-right:6px;font-weight:400}
.quote-bar button{background:none;border:none;color:var(--icon);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;transition:color var(--t-fast)}
.quote-bar button:hover{color:var(--icon-hover)}

.emoji-panel{display:none;flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.7);height:200px;flex-direction:column;animation:panelUp var(--t-fast) both}
.emoji-panel.open{display:flex}
@keyframes panelUp{from{transform:translateY(100%);opacity:.6}to{transform:translateY(0);opacity:1}}
.emoji-panel-tabs{display:flex;align-items:center;justify-content:space-around;padding:10px 12px 6px;border-bottom:1px solid rgba(255,255,255,.6);flex-shrink:0}
.emoji-panel-tabs button{flex:1;border:none;background:none;cursor:pointer;font:inherit;font-size:12.5px;color:var(--sub);padding:8px 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;transition:all var(--t-fast);white-space:nowrap;letter-spacing:.04em}
.emoji-panel-tabs button.on{color:var(--text);background:rgba(255,255,255,.75)}
.emoji-panel-tabs button:active{transform:scale(.96)}
.emoji-panel-body{flex:1;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.emoji-panel-body::-webkit-scrollbar{width:4px}
.emoji-panel-body::-webkit-scrollbar-thumb{background:rgba(142,142,147,.15);border-radius:2px}
.emoji-panel-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-panel-grid button{aspect-ratio:1;border-radius:10px;font-size:20px;cursor:pointer;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(120,130,160,.04);transition:transform var(--t-fast),box-shadow var(--t-fast),border-color var(--t-fast);display:grid;place-items:center;overflow:hidden;padding:0;position:relative}
.emoji-panel-grid button:hover{box-shadow:0 4px 12px rgba(120,130,160,.1);border-color:rgba(167,139,250,.4);transform:translateY(-1px)}
.emoji-panel-grid button:active{transform:scale(.9)}
.emoji-panel-grid button img{width:100%;height:100%;object-fit:cover}
.emoji-panel-empty{text-align:center;font-size:12.5px;color:var(--sub);padding:40px 20px;line-height:1.9;letter-spacing:.04em}

.composer{display:flex;align-items:flex-end;gap:8px;flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid rgba(255,255,255,.6);background:rgba(247,247,248,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;z-index:5}
.tool-toggle{width:38px;height:38px;flex-shrink:0;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);color:var(--icon);font-size:20px;line-height:1;display:grid;place-items:center;transition:all var(--t-fast);align-self:flex-end;margin-bottom:2px;box-shadow:0 2px 8px rgba(120,130,160,.06)}
.tool-toggle:hover{color:var(--icon-hover);box-shadow:0 4px 14px rgba(120,130,160,.12)}
.tool-toggle.on{transform:rotate(45deg);color:var(--star-violet);border-color:rgba(167,139,250,.4)}
.input-wrap{flex:1;display:flex;align-items:flex-end;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:9px 14px;min-height:42px;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:box-shadow var(--t-fast),border-color var(--t-fast)}
.input-wrap:focus-within{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
textarea{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font:inherit;font-size:16px;line-height:1.7;max-height:110px;padding:2px 0;scrollbar-width:none;font-family:var(--app-font);letter-spacing:.02em}
textarea::-webkit-scrollbar{display:none}
textarea::placeholder{color:var(--dim);letter-spacing:.04em}
.send-btn{width:62px;height:38px;flex-shrink:0;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,rgba(74,74,79,.9),rgba(74,74,79,1));color:#fff;font-size:14px;font-weight:400;font-family:var(--app-font);letter-spacing:.06em;transition:opacity var(--t-fast),transform var(--t-fast),box-shadow var(--t-slow);align-self:flex-end;box-shadow:0 2px 8px rgba(74,74,79,.15)}
.send-btn:not(:disabled):hover{box-shadow:0 4px 16px rgba(74,74,79,.25)}
.send-btn:not(:disabled):active{transform:scale(.96)}
.send-btn:disabled{opacity:.25;cursor:default;box-shadow:none}
.card-pick-btn{flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);font:inherit;font-size:14px;font-weight:400;cursor:pointer;align-self:flex-end;min-height:42px;transition:all var(--t-fast);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font);letter-spacing:.04em}
.card-pick-btn:hover{border-color:rgba(167,139,250,.4);box-shadow:0 4px 16px rgba(167,139,250,.1)}
.card-pick-btn:active{transform:scale(.98)}

.tool-panel{position:absolute;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-top:1px solid rgba(255,255,255,.8);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));transform:translateY(110%);transition:transform var(--t-slow);box-shadow:0 -12px 40px -12px rgba(120,130,160,.12)}
.tool-panel.open{transform:translateY(0)}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:none;color:var(--sub);font-size:11px;padding:0;font-family:var(--app-font);letter-spacing:.04em;transition:color var(--t-fast),transform var(--t-fast)}
.tool-item:hover{color:var(--icon-hover)}
.tool-item:active{transform:scale(.94)}
.tool-ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 2px rgba(120,130,160,.05);transition:box-shadow var(--t-slow),border-color var(--t-slow)}
.tool-item:hover .tool-ico{border-color:rgba(167,139,250,.4);box-shadow:0 4px 16px rgba(167,139,250,.12)}

.mini-call{position:absolute;z-index:70;background:rgba(28,28,30,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:var(--radius-pill);padding:6px 6px 6px 8px;display:none;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.25);right:12px;bottom:88px;touch-action:none;user-select:none;border:1px solid rgba(255,255,255,.12)}
.mini-call.show{display:flex}
.mini-call.dragging{transition:none}
.mini-call .ma{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:400;color:#fff;background:linear-gradient(135deg,var(--star-violet),var(--star-blue));flex-shrink:0;pointer-events:none}
.mini-call .mt{font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none;min-width:42px;letter-spacing:.06em}
.mini-call .hang-mini{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;font-size:12px;flex-shrink:0;padding:0;transition:background var(--t-fast)}
.mini-call .hang-mini:hover{background:rgba(255,255,255,.24)}
.mini-call .hang-mini:active{transform:scale(.9)}

/* ============================================================
   迷你音乐播放条
   ============================================================ */
.mini-player{
  position:absolute;
  left:12px;right:12px;
  bottom:calc(66px + env(safe-area-inset-bottom,0));
  z-index:55;
  background:rgba(28,28,30,.9);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  color:#fff;
  border-radius:16px;
  padding:9px 10px 9px 12px;
  display:none;
  align-items:center;
  gap:10px;
  box-shadow:0 12px 40px -12px rgba(0,0,0,.45),0 0 20px rgba(167,139,250,.15);
  border:1px solid rgba(255,255,255,.12);
  animation:mpSlideUp .3s cubic-bezier(.22,.61,.36,1);
}
.mini-player.show{display:flex}
@keyframes mpSlideUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.mini-player .mp-cover{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--star-violet),var(--star-blue));
  display:grid;place-items:center;
  font-size:17px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(167,139,250,.3);
  position:relative;
  overflow:hidden;
}
.mini-player.playing .mp-cover::after{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.3),transparent 70%);
  animation:mpPulse 2s ease-in-out infinite;
}
@keyframes mpPulse{
  0%,100%{opacity:.4;transform:scale(.8)}
  50%{opacity:.9;transform:scale(1.2)}
}
.mini-player .mp-info{flex:1;min-width:0}
.mini-player .mp-name{
  font-size:13px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.02em;font-family:var(--app-font);
}
.mini-player .mp-status{
  font-size:10.5px;opacity:.7;margin-top:3px;
  letter-spacing:.06em;font-family:var(--app-font);
}
.mini-player .mp-btn{
  width:34px;height:34px;border-radius:50%;
  border:none;background:rgba(255,255,255,.14);
  color:#fff;font-size:14px;cursor:pointer;
  display:grid;place-items:center;flex-shrink:0;
  transition:background var(--t-fast),transform var(--t-fast);
  padding:0;
}
.mini-player .mp-btn:hover{background:rgba(255,255,255,.24)}
.mini-player .mp-btn:active{transform:scale(.9)}
.mini-player .mp-btn.close{
  font-size:12px;
  background:rgba(255,90,122,.4);
}
.mini-player .mp-btn.close:hover{background:rgba(255,90,122,.6)}

.page-head{display:flex;align-items:center;gap:10px;padding:12px 18px 14px;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top,0))}
.page-head h1{font-size:var(--fs-title);font-weight:400;color:var(--text);flex:1;letter-spacing:.02em}
.page-back{width:36px;height:36px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--icon);border-radius:50%;transition:color var(--t-fast),background var(--t-fast)}
.page-back svg{stroke-width:1.5}
.page-back:hover{color:var(--icon-hover);background:rgba(255,255,255,.6)}
.page-back:active{transform:scale(.92)}
.page-body{flex:1;overflow-y:auto;padding:0 18px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.page-body::-webkit-scrollbar{display:none}

.card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-card);padding:20px;margin-bottom:12px;box-shadow:var(--glass-shadow);transition:box-shadow var(--t-slow),border-color var(--t-slow),transform var(--t-slow)}
.card:hover{border-color:rgba(167,139,250,.4);box-shadow:var(--glass-shadow-hover);transform:translateY(-1px)}

.card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:400;color:var(--text);margin-bottom:10px;letter-spacing:.02em}
.card-title .badge{margin-left:auto;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.06em}
.muted{font-size:13px;color:var(--sub);line-height:1.85;letter-spacing:.02em}

.btn{border:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:400;padding:10px 18px;border-radius:var(--radius-btn);transition:all var(--t-fast);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);color:var(--text);font-family:var(--app-font);letter-spacing:.04em;box-shadow:0 1px 2px rgba(120,130,160,.04)}
.btn:hover{box-shadow:0 4px 16px rgba(120,130,160,.1);border-color:rgba(167,139,250,.4);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border:1px solid transparent;box-shadow:0 2px 8px rgba(74,74,79,.15)}
.btn.primary:hover{box-shadow:0 4px 16px rgba(74,74,79,.25)}
.btn.purple{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border:1px solid transparent}
.btn.danger{color:#B89A9A;background:rgba(212,181,181,.12);border-color:rgba(212,181,181,.25)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-sm)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.input,.textarea{width:100%;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-btn);padding:11px 14px;color:var(--text);font:inherit;font-size:14.5px;outline:none;transition:box-shadow var(--t-fast),border-color var(--t-fast);box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font);letter-spacing:.02em}
.input:focus,.textarea:focus{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
.input::placeholder,.textarea::placeholder{color:var(--dim)}
.textarea{resize:vertical;min-height:80px;line-height:1.85}

.list-row{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-card);margin-bottom:8px;cursor:pointer;transition:box-shadow var(--t-slow),transform var(--t-fast),border-color var(--t-slow);box-shadow:var(--glass-shadow)}
.list-row:hover{border-color:rgba(167,139,250,.4);box-shadow:var(--glass-shadow-hover);transform:translateY(-1px)}
.list-row:active{transform:scale(.99)}
.list-row .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);flex-shrink:0;color:var(--icon)}
.list-row .tt{flex:1;font-size:14.5px;font-weight:400;color:var(--text);letter-spacing:.02em;min-width:0}
.list-row .sub{font-size:11.5px;color:var(--sub);margin-top:2px;font-weight:400;letter-spacing:.04em;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .arrow{color:var(--dim);font-size:15px;transition:color var(--t-fast)}
.list-row:hover .arrow{color:var(--star-violet)}

.overlay{position:absolute;inset:0;background:rgba(180,190,210,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--t-slow);z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:92%;background:rgba(248,248,250,.85);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-top:1px solid rgba(255,255,255,.9);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform var(--t-slow);box-shadow:0 -20px 60px -20px rgba(120,130,160,.2)}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 20px 14px;border-bottom:1px solid rgba(255,255,255,.7);flex-shrink:0}
.sheet-head h3{font-size:17px;font-weight:400;color:var(--text);flex:1;letter-spacing:.02em}
.sheet-body{overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-close{width:32px;height:32px;border:none;background:transparent;cursor:pointer;color:var(--icon);display:grid;place-items:center;font-size:17px;border-radius:50%;transition:color var(--t-fast),background var(--t-fast)}
.sheet-close:hover{color:var(--icon-hover);background:rgba(255,255,255,.6)}

.tabbar{position:relative;z-index:20;flex-shrink:0;display:flex;border-top:1px solid rgba(255,255,255,.7);background:rgba(247,247,248,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom,0)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;background:none;border:none;cursor:pointer;color:var(--icon);font-size:10.5px;transition:color var(--t-fast);letter-spacing:.08em;font-family:var(--app-font)}
.tab svg{width:20px;height:20px;stroke-width:1.5}
.tab:hover{color:var(--icon-hover)}
.tab.active{color:var(--star-violet)}
.tab.active::after{content:'';position:absolute;bottom:4px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--star-violet);transform:translateX(-50%);box-shadow:0 0 8px var(--star-violet)}

.call-overlay{position:absolute;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse 120% 80% at 0% 0%,rgba(167,139,250,.15),transparent 60%),radial-gradient(ellipse 120% 80% at 100% 100%,rgba(96,165,250,.15),transparent 60%),linear-gradient(180deg,#2A2A2E,#1C1C1E);padding:32px;color:#fff}
.call-overlay.show{display:flex}
.call-avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:400;background:#3A3A3E center/cover no-repeat;box-shadow:0 0 60px rgba(167,139,250,.3);font-family:var(--app-font);border:1px solid rgba(255,255,255,.1)}
.call-name{font-size:22px;font-weight:400;color:#fff;letter-spacing:.02em}
.call-time{font-size:13px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;min-height:18px;letter-spacing:.08em}
.call-actions{display:flex;gap:22px;margin-top:20px}
.call-act{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:grid;place-items:center;color:#fff;transition:transform var(--t-fast),background var(--t-fast)}
.call-act:active{transform:scale(.94)}
.call-hang{background:linear-gradient(135deg,#C88A8A,#B87A7A)}
.call-mute{background:rgba(255,255,255,.14)}
.call-mini{background:rgba(255,255,255,.14);font-size:14px}
.call-accept{background:linear-gradient(135deg,#8AB89A,#7AA88A);font-size:22px;display:none}
.call-actions.incoming .call-mute{display:none}
.call-actions.incoming .call-hang{display:grid}
.call-actions.incoming .call-accept{display:grid}
.call-actions.outgoing .call-accept{display:none}
.call-actions.outgoing .call-mute,
.call-actions.outgoing .call-mini{display:grid}
.call-label{font-size:13px;color:rgba(255,255,255,.55);margin-top:-6px;letter-spacing:.06em}

.choose-wrap{padding:4px 0 10px}
.choose-header{text-align:center;margin-bottom:22px}
.choose-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 35% 30%,rgba(167,139,250,.15),rgba(96,165,250,.1));border:1px solid rgba(255,255,255,.8);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 20px rgba(167,139,250,.15)}
.choose-title{font-size:20px;font-weight:400;color:var(--text);letter-spacing:.02em}
.choose-label{font-size:12.5px;color:var(--sub);font-weight:400;margin-bottom:8px;margin-top:16px;letter-spacing:.06em}
.choose-q{margin-bottom:6px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-btn);padding:12px 14px;font-size:15px;box-shadow:0 1px 2px rgba(120,130,160,.04);color:var(--text)}
.choose-q:focus{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
.choose-options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.choose-opt-row{display:flex;align-items:center;gap:10px}
.choose-num{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.85);color:var(--text);display:grid;place-items:center;font-size:14px;font-weight:400;font-family:var(--app-font);box-shadow:0 1px 2px rgba(120,130,160,.04)}
.choose-opt-input{flex:1;padding:11px 14px;border-radius:var(--radius-btn);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:inherit;font-size:14.5px;color:var(--text);outline:none;transition:box-shadow var(--t-fast),border-color var(--t-fast);box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font)}
.choose-opt-input:focus{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
.choose-del{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:transparent;border:none;cursor:pointer;font-size:17px;color:var(--dim);display:grid;place-items:center;transition:color var(--t-fast)}
.choose-del:hover{color:var(--icon-hover)}
.choose-del:active{transform:scale(.9)}
.choose-add{display:block;width:100%;padding:13px;background:none;border:none;cursor:pointer;color:var(--sub);font-size:14.5px;font-weight:400;margin-bottom:22px;letter-spacing:.06em;transition:color var(--t-fast);font-family:var(--app-font)}
.choose-add:hover{color:var(--star-violet)}
.choose-add:active{opacity:.6}
.choose-btns{display:flex;gap:10px}
.ch-btn{flex:1;padding:14px 10px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);font-size:14.5px;font-weight:400;cursor:pointer;transition:all var(--t-fast);display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.04em;font-family:var(--app-font);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);box-shadow:0 1px 2px rgba(120,130,160,.04)}
.ch-btn:hover{border-color:rgba(167,139,250,.4);box-shadow:0 4px 16px rgba(167,139,250,.12);transform:translateY(-1px)}
.ch-btn:active{transform:scale(.98)}
.ch-btn-1,.ch-btn-2{background:rgba(255,255,255,.75);color:var(--text)}

.card-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.card-tabs::-webkit-scrollbar{display:none}
.card-tab{flex-shrink:0;padding:9px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:400;cursor:pointer;border:1px solid rgba(255,255,255,.9);transition:all var(--t-fast);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font);letter-spacing:.04em}
.card-tab:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}
.card-tab.active{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(74,74,79,.2)}
.card-tab .cnt{font-size:11px;opacity:.75;margin-left:5px}
.card-tab.add-tab{background:rgba(255,255,255,.55);color:var(--sub);border:1px dashed rgba(167,139,250,.4);box-shadow:none}
.card-tab.add-tab:hover{color:var(--star-violet);border-color:rgba(167,139,250,.6)}

.search-row{display:flex;gap:10px;margin-bottom:14px}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-btn);padding:11px 14px;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:box-shadow var(--t-fast),border-color var(--t-fast)}
.search-box:focus-within{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
.search-box input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:14.5px;color:var(--text);font-family:var(--app-font)}
.search-box .ic{font-size:14px;color:var(--dim)}
.batch-btn{padding:11px 16px;border-radius:var(--radius-btn);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:13px;font-weight:400;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:all var(--t-fast);font-family:var(--app-font);letter-spacing:.04em}
.batch-btn:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}
.batch-btn.on{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border-color:transparent}

.add-area{display:flex;gap:10px;margin-bottom:10px}
.add-area textarea{flex:1;min-height:90px;padding:13px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:inherit;font-size:14.5px;color:var(--text);outline:none;resize:vertical;line-height:1.85;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:box-shadow var(--t-fast),border-color var(--t-fast);font-family:var(--app-font)}
.add-area textarea:focus{border-color:rgba(167,139,250,.4);box-shadow:0 1px 2px rgba(120,130,160,.04),0 4px 16px rgba(167,139,250,.1)}
.add-area .add-btn{width:72px;border-radius:var(--radius-card);border:none;background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;font-size:14px;font-weight:400;cursor:pointer;display:grid;place-items:center;font-family:var(--app-font);letter-spacing:.06em;transition:opacity var(--t-fast),box-shadow var(--t-fast);box-shadow:0 2px 8px rgba(74,74,79,.15)}
.add-area .add-btn:hover{box-shadow:0 4px 16px rgba(74,74,79,.25)}
.add-hint{font-size:11.5px;color:var(--dim);text-align:center;margin-bottom:12px;letter-spacing:.04em}

.tools-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tool-mini{padding:8px 13px;border-radius:var(--radius-btn);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:12px;font-weight:400;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:all var(--t-fast);font-family:var(--app-font);letter-spacing:.04em}
.tool-mini:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}
.tool-mini:active{transform:scale(.96)}
.file-label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.file-label input{display:none}

.batch-bar{display:none;align-items:center;gap:10px;padding:11px 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-card);margin-bottom:12px;box-shadow:0 1px 2px rgba(120,130,160,.04)}
.batch-bar.show{display:flex}
.batch-bar .info{flex:1;font-size:13px;color:var(--sub);font-weight:400;letter-spacing:.02em}
.batch-bar .info b{color:var(--text);font-weight:400}

.card-count{font-size:12.5px;color:var(--sub);margin-bottom:10px;letter-spacing:.04em}
.card-count b{color:var(--text);font-weight:400}

.card-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius-card);margin-bottom:7px;position:relative;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:box-shadow var(--t-slow),border-color var(--t-slow)}
.card-item:hover{border-color:rgba(167,139,250,.4);box-shadow:0 4px 16px rgba(167,139,250,.08)}
.card-item .checkbox{width:20px;height:20px;flex-shrink:0;border-radius:7px;border:1.5px solid var(--dim);display:none;place-items:center;background:rgba(255,255,255,.8);color:#fff;font-size:11px;font-weight:400;cursor:pointer;transition:all var(--t-fast);font-family:var(--app-font)}
.batch-mode .card-item .checkbox{display:grid}
.card-item .checkbox.checked{background:var(--star-violet);border-color:var(--star-violet)}
.card-item .txt{flex:1;font-size:14.5px;color:var(--text);word-break:break-word;letter-spacing:.02em;line-height:1.7}
.card-item .tag{font-size:10.5px;padding:3px 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--sub);white-space:nowrap;letter-spacing:.04em}
.card-item .act{width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--icon);display:grid;place-items:center;border-radius:50%;transition:color var(--t-fast),background var(--t-fast)}
.card-item .act:hover{color:var(--icon-hover);background:rgba(255,255,255,.6)}
.card-item .act.del{color:var(--dim)}
.card-item .act.del:hover{color:#C88A8A}
.card-item.selected{background:rgba(167,139,250,.08)}
.card-empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px;letter-spacing:.04em;line-height:1.9}

.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avatar-grid .ag{aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.9);cursor:pointer;background:rgba(240,240,245,.8) center/cover no-repeat;position:relative;transition:transform var(--t-fast),box-shadow var(--t-slow),border-color var(--t-slow);box-shadow:0 1px 2px rgba(120,130,160,.04)}
.avatar-grid .ag:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.5);box-shadow:0 8px 20px rgba(167,139,250,.15)}
.avatar-grid .ag.sel{border-color:var(--star-violet);box-shadow:0 0 0 1px var(--star-violet),0 8px 20px rgba(167,139,250,.2)}
.avatar-grid .ag .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(28,28,30,.65);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.avatar-grid .ag.add{background:rgba(255,255,255,.55);border:1.5px dashed rgba(167,139,250,.35);display:grid;place-items:center;color:var(--dim);font-size:22px;box-shadow:none}
.avatar-grid .ag.add:hover{border-color:rgba(167,139,250,.6);color:var(--star-violet)}

.emoji-tabs{display:flex;gap:8px;margin-bottom:14px}
.emoji-tabs button{flex:1;padding:10px;border-radius:var(--radius-btn);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:13px;font-weight:400;cursor:pointer;transition:all var(--t-fast);font-family:var(--app-font);letter-spacing:.04em;box-shadow:0 1px 2px rgba(120,130,160,.04)}
.emoji-tabs button:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}
.emoji-tabs button.on{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border-color:transparent}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{aspect-ratio:1;border-radius:10px;font-size:17px;cursor:pointer;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);transition:transform var(--t-fast),box-shadow var(--t-fast),border-color var(--t-fast);display:grid;place-items:center;overflow:hidden;padding:0;position:relative;box-shadow:0 1px 2px rgba(120,130,160,.04)}
.emoji-grid button:hover{transform:translateY(-1px);border-color:rgba(167,139,250,.4);box-shadow:0 4px 14px rgba(167,139,250,.12)}
.emoji-grid button img{width:100%;height:100%;object-fit:cover}
.emoji-grid button .x{position:absolute;top:2px;right:2px;font-size:9px;color:#fff;background:rgba(28,28,30,.65);border-radius:50%;width:13px;height:13px;display:grid;place-items:center;line-height:1}

.period-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.period-cal .d{aspect-ratio:1;display:grid;place-items:center;font-size:13px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);color:var(--sub);cursor:pointer;position:relative;font-family:var(--app-font);box-shadow:0 1px 2px rgba(120,130,160,.04);transition:all var(--t-fast)}
.period-cal .d:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4);box-shadow:0 4px 14px rgba(167,139,250,.12)}
.period-cal .d.start{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;font-weight:400;border-color:transparent}
.period-cal .d.during{background:rgba(212,181,181,.2);border-color:rgba(212,181,181,.35);color:var(--text)}
.period-cal .d.today{border-color:var(--star-violet);box-shadow:0 0 0 1px var(--star-violet)}
.period-cal .d.future{opacity:.32;cursor:default}

.pomo-ring{width:170px;height:170px;margin:10px auto 16px;position:relative;display:grid;place-items:center}
.pomo-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pomo-ring .track{fill:none;stroke:rgba(167,139,250,.1);stroke-width:7}
.pomo-ring .prog{fill:none;stroke:var(--star-violet);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s linear;filter:drop-shadow(0 0 6px rgba(167,139,250,.35))}
.pomo-num{font-size:32px;font-weight:400;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.04em;font-family:var(--app-font)}

.toast{position:absolute;left:50%;top:calc(60px + env(safe-area-inset-top,0));transform:translate(-50%,-12px);z-index:200;background:rgba(28,28,30,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:11px 20px;border-radius:var(--radius-pill);font-size:13px;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity var(--t-fast),transform var(--t-fast);white-space:nowrap;max-width:86%;box-shadow:0 8px 32px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);font-family:var(--app-font)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.burst-wrap{padding:4px 0 3px}
.burst-title{font-size:22px;font-weight:400;color:var(--text);text-align:center;padding:12px 6px 20px;letter-spacing:.02em;line-height:1.5}
.burst-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:38vh;overflow-y:auto;scrollbar-width:none;padding:4px}
.burst-list::-webkit-scrollbar{display:none}
.burst-empty{text-align:center;color:var(--sub);font-size:13px;padding:22px 0;letter-spacing:.04em}
.burst-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius-card);padding:12px 16px;animation:burstIn var(--t-fast) both;box-shadow:0 1px 2px rgba(120,130,160,.04)}
@keyframes burstIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.burst-item .txt{flex:1;font-size:14.5px;color:var(--text);word-break:break-word;white-space:pre-wrap;line-height:1.75;letter-spacing:.02em}
.burst-item .thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;flex-shrink:0;background:rgba(240,240,245,.8);display:block}
.burst-item .act{width:30px;height:30px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:50%;font-size:14px;color:var(--icon);transition:color var(--t-fast),background var(--t-fast)}
.burst-item .act:hover{color:var(--icon-hover);background:rgba(255,255,255,.6)}
.burst-item .act.del:hover{color:#C88A8A}
.burst-add-img{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:14.5px;font-weight:400;cursor:pointer;margin-bottom:18px;transition:all var(--t-fast);box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font);letter-spacing:.04em}
.burst-add-img:hover{color:var(--star-violet);border-color:rgba(167,139,250,.4);box-shadow:0 4px 16px rgba(167,139,250,.1)}
.burst-heart{text-align:center;font-size:20px;color:var(--dim);opacity:.6;margin:6px 0 14px;letter-spacing:6px}
.burst-actions{display:flex;gap:10px;padding:0 2px}
.burst-btn-cancel{flex:1;padding:14px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);cursor:pointer;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:14.5px;font-weight:400;font-family:var(--app-font);letter-spacing:.04em;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:all var(--t-fast)}
.burst-btn-cancel:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}
.burst-btn-send{flex:1.6;padding:14px;border-radius:var(--radius-card);border:none;cursor:pointer;background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;font-size:14.5px;font-weight:400;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--app-font);letter-spacing:.04em;box-shadow:0 2px 8px rgba(74,74,79,.15);transition:all var(--t-fast)}
.burst-btn-send:hover{box-shadow:0 4px 16px rgba(74,74,79,.25)}
.burst-btn-send:disabled{opacity:.3;cursor:default;box-shadow:none}

.imp-info{font-size:12.5px;color:var(--sub);background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.12);padding:12px 16px;border-radius:var(--radius-card);margin-bottom:12px;line-height:1.85;letter-spacing:.02em}
.imp-info b{color:var(--text);font-weight:400}

.notif-card{background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(96,165,250,.06));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius-card);padding:20px;margin-bottom:12px;box-shadow:var(--glass-shadow)}
.notif-card .t{font-size:15px;font-weight:400;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.notif-card .d{font-size:12.5px;color:var(--sub);line-height:1.85}

.rp-choose-icon{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle at 35% 30%,rgba(255,240,240,.9),rgba(212,181,181,.3));border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;font-size:36px;box-shadow:0 8px 28px rgba(212,181,181,.25)}
.rp-choose-amt{font-size:28px;font-weight:400;color:var(--text);letter-spacing:.02em;text-align:center;margin-bottom:8px;font-family:var(--app-font)}
.rp-choose-note{font-size:14px;color:var(--sub);text-align:center;margin-bottom:24px;letter-spacing:.02em}
.rp-btn-take{flex:1.6;padding:14px;border-radius:var(--radius-card);border:none;cursor:pointer;background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;font-size:14.5px;font-weight:400;letter-spacing:.06em;font-family:var(--app-font);transition:all var(--t-fast);box-shadow:0 2px 8px rgba(74,74,79,.15)}
.rp-btn-take:hover{box-shadow:0 4px 16px rgba(74,74,79,.25)}
.rp-btn-return{flex:1;padding:14px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);cursor:pointer;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sub);font-size:14.5px;font-weight:400;font-family:var(--app-font);letter-spacing:.04em;box-shadow:0 1px 2px rgba(120,130,160,.04);transition:all var(--t-fast)}
.rp-btn-return:hover{color:var(--icon-hover);border-color:rgba(167,139,250,.4)}

.font-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.font-presets button{padding:12px 10px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);font-size:14.5px;font-weight:400;cursor:pointer;transition:all var(--t-fast);text-align:center;box-shadow:0 1px 2px rgba(120,130,160,.04);font-family:var(--app-font);letter-spacing:.02em}
.font-presets button:hover{box-shadow:0 4px 16px rgba(167,139,250,.12);border-color:rgba(167,139,250,.4);transform:translateY(-1px)}
.font-presets button.on{background:linear-gradient(135deg,rgba(74,74,79,.92),rgba(74,74,79,1));color:#fff;border-color:transparent}
.font-preview{padding:18px;border-radius:var(--radius-card);background:rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);margin-bottom:8px;box-shadow:0 1px 2px rgba(120,130,160,.04)}
.font-preview .msg{margin-bottom:0}

.bubble-mode-tabs{
  display:flex;
  gap:6px;
  padding:4px;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.85);
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 1px 2px rgba(120,130,160,.04);
}

<script>
(function(){
'use strict';

const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtDate = ts => { const d = new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = arr => arr[Math.floor(Math.random()*arr.length)];
const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
const randFloat = (min, max) => min + Math.random() * (max - min);
const isChatActive = () => {
  const el = document.getElementById('v-chat');
  return !!el && el.classList.contains('active');
};

/* ============================================================
   外观设置模块（字体 + 气泡可视化 + 气泡 CSS）
   ============================================================ */
const APPEARANCE_KEY = 'whisper-appearance-v1';

const FONT_PRESETS = [
  { name:'默认',     value:'' },
  { name:'宋体',     value:'"Songti SC","SimSun","STSong",serif' },
  { name:'黑体',     value:'"Heiti SC","SimHei","STHeiti",sans-serif' },
  { name:'楷体',     value:'"Kaiti SC","KaiTi","STKaiti",serif' },
  { name:'圆体',     value:'"Yuanti SC","Hiragino Maru Gothic ProN",sans-serif' },
  { name:'手写体',   value:'"Hannotate SC","Hanzipen SC","Kalam",cursive' },
  { name:'苹方',     value:'"PingFang SC","Hiragino Sans GB",sans-serif' },
  { name:'微软雅黑', value:'"Microsoft YaHei","PingFang SC",sans-serif' }
];

const DEFAULT_FONT_FAMILY = '"Kalam","Caveat","Long Cang","Ma Shan Zheng","Hanzipen SC","Hannotate SC","STKaiti","KaiTi",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",cursive,sans-serif';

const BUBBLE_PRESETS = {
  handdrawn: {
    name: '手绘',
    my:    { bg:'#F2F2F5', color:'#4A4A4F', radius:8, borderStyle:'dashed', borderWidth:1.5, borderColor:'#4A4A4F', shadow:'sticker', padY:10, padX:14, maxW:72, deco:true },
    their: { bg:'#F2F2F5', color:'#4A4A4F', radius:8, borderStyle:'dashed', borderWidth:1.5, borderColor:'#4A4A4F', shadow:'sticker', padY:10, padX:14, maxW:72, deco:true }
  },
  simple: {
    name: '简约',
    my:    { bg:'#EFEFF2', color:'#4A4A4F', radius:14, borderStyle:'none', borderWidth:0, borderColor:'#DDDDDD', shadow:'soft', padY:10, padX:14, maxW:72, deco:false },
    their: { bg:'#FFFFFF', color:'#4A4A4F', radius:14, borderStyle:'none', borderWidth:0, borderColor:'#DDDDDD', shadow:'soft', padY:10, padX:14, maxW:72, deco:false }
  },
  round: {
    name: '圆润',
    my:    { bg:'#E8E8F0', color:'#4A4A4F', radius:22, borderStyle:'none', borderWidth:0, borderColor:'#DDDDDD', shadow:'soft', padY:12, padX:16, maxW:72, deco:false },
    their: { bg:'#F5F5F8', color:'#4A4A4F', radius:22, borderStyle:'none', borderWidth:0, borderColor:'#DDDDDD', shadow:'soft', padY:12, padX:16, maxW:72, deco:false }
  },
  outline: {
    name: '描边',
    my:    { bg:'transparent', color:'#4A4A4F', radius:12, borderStyle:'solid', borderWidth:1.5, borderColor:'#8E8E93', shadow:'none', padY:10, padX:14, maxW:72, deco:false },
    their: { bg:'transparent', color:'#4A4A4F', radius:12, borderStyle:'solid', borderWidth:1.5, borderColor:'#8E8E93', shadow:'none', padY:10, padX:14, maxW:72, deco:false }
  }
};

const BUBBLE_CSS_TEMPLATE = `/* 我的气泡 */
.msg.me .bubble {
  background: #F2F2F5;
  color: #4A4A4F;
  border-radius: 8px;
  border: 1.5px dashed #4A4A4F;
  box-shadow: 2px 2px 0px rgba(74,74,79,.15);
  padding: 10px 14px;
}

/* TA 的气泡 */
.msg.them .bubble {
  background: #F2F2F5;
  color: #4A4A4F;
  border-radius: 8px;
  border: 1.5px dashed #4A4A4F;
  box-shadow: 2px 2px 0px rgba(74,74,79,.15);
  padding: 10px 14px;
}
`;

const COVER_PRESETS = [
  { name:'雾霾紫', v:'linear-gradient(135deg,#C8B8E8,#9EB4D8)' },
  { name:'月光蓝', v:'linear-gradient(135deg,#B8D0E8,#A8C8E0)' },
  { name:'藕粉',   v:'linear-gradient(135deg,#E8D4D8,#D8C0C8)' },
  { name:'霜白',   v:'linear-gradient(135deg,#E8E8EE,#D0D0DA)' },
  { name:'青苔绿', v:'linear-gradient(135deg,#C8D8D0,#A8C0B0)' },
  { name:'暖沙',   v:'linear-gradient(135deg,#E0D4C0,#D0C0A8)' },
  { name:'静夜',   v:'linear-gradient(135deg,#4A4A52,#2A2A32)' },
  { name:'暮橙',   v:'linear-gradient(135deg,#E8D0B8,#D8B898)' },
  { name:'无封面', v:'' }
];

let appearance = null;

function getDefaultBubbleSide(side){
  const p = BUBBLE_PRESETS.handdrawn[side];
  return Object.assign({}, p);
}

function getDefaultAppearance(){
  return {
    fontFamily: '',
    fontUrl: '',
    fontName: '',
    fontSize: 16,
    bubblePreset: 'handdrawn',
    bubbleMode: 'visual',
    bubbleCss: '',
    my: getDefaultBubbleSide('my'),
    their: getDefaultBubbleSide('their')
  };
}

function loadAppearance(){
  try{
    const raw = localStorage.getItem(APPEARANCE_KEY);
    if(!raw) return getDefaultAppearance();
    const parsed = JSON.parse(raw);
    const def = getDefaultAppearance();
    const out = Object.assign({}, def, parsed);
    if(typeof out.fontSize !== 'number' || isNaN(out.fontSize)) out.fontSize = def.fontSize;
    if(typeof out.bubbleCss !== 'string') out.bubbleCss = '';
    if(out.bubbleMode !== 'visual' && out.bubbleMode !== 'css') out.bubbleMode = 'visual';
    out.my = Object.assign({}, def.my, parsed.my || {});
    out.their = Object.assign({}, def.their, parsed.their || {});
    return out;
  }catch(e){
    console.warn('loadAppearance 失败:', e);
    return getDefaultAppearance();
  }
}

function saveAppearance(){
  try{ localStorage.setItem(APPEARANCE_KEY, JSON.stringify(appearance)); }
  catch(e){ console.warn('saveAppearance 失败:', e); }
}

function ensureFontStyle(){
  const url = (appearance && appearance.fontUrl) || '';
  const name = (appearance && appearance.fontName) || '';
  const styleId = 'whisper-custom-font';
  const linkId = 'whisper-font-link';
  let styleEl = document.getElementById(styleId);
  let linkEl = document.getElementById(linkId);

  if(!url){
    if(styleEl) styleEl.remove();
    if(linkEl) linkEl.remove();
    return;
  }

  const isFontFile = /\.(woff2?|ttf|otf|eot)(\?|#|$)/i.test(url);

  if(isFontFile){
    if(linkEl) linkEl.remove();
    const ffName = name || 'WhisperCustomFont';
    const css = '@font-face{font-family:"' + ffName + '";src:url("' + url + '");font-display:swap;}';
    if(!styleEl){
      styleEl = document.createElement('style');
      styleEl.id = styleId;
      document.head.appendChild(styleEl);
    }
    if(styleEl.textContent !== css) styleEl.textContent = css;
  } else {
    if(styleEl) styleEl.remove();
    if(linkEl && linkEl.getAttribute('href') === url) return;
    if(linkEl) linkEl.remove();
    const link = document.createElement('link');
    link.id = linkId;
    link.rel = 'stylesheet';
    link.href = url;
    document.head.appendChild(link);
  }
}

function applyCustomBubbleCss(){
  let styleEl = document.getElementById('whisper-bubble-css');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'whisper-bubble-css';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = appearance.bubbleCss || '';
}

function shadowValue(type){
  switch(type){
    case 'none':   return 'none';
    case 'soft':   return '0 1px 2px rgba(74,74,79,.06), 0 2px 8px rgba(74,74,79,.06)';
    case 'strong': return '0 2px 4px rgba(74,74,79,.12), 0 6px 20px rgba(74,74,79,.14)';
    case 'sticker':return '2px 2px 0px rgba(74,74,79,.15)';
    default:       return 'none';
  }
}

function applyBubble(side){
  const root = document.documentElement;
  const b = appearance[side];
  const prefix = side === 'my' ? '--my-bubble-' : '--their-bubble-';
  root.style.setProperty(prefix + 'bg', b.bg || 'transparent');
  root.style.setProperty(prefix + 'color', b.color || '#4A4A4F');
  root.style.setProperty(prefix + 'radius', (b.radius || 8) + 'px');

  if(b.borderStyle === 'none' || !b.borderWidth){
    root.style.setProperty(prefix + 'border', '0 solid transparent');
  } else {
    root.style.setProperty(prefix + 'border', (b.borderWidth || 0) + 'px ' + b.borderStyle + ' ' + (b.borderColor || '#4A4A4F'));
  }
  root.style.setProperty(prefix + 'shadow', shadowValue(b.shadow));
  root.style.setProperty(prefix + 'padding', (b.padY || 10) + 'px ' + (b.padX || 14) + 'px');
  root.style.setProperty(prefix + 'max-width', (b.maxW || 72) + '%');
  root.style.setProperty(prefix + 'deco', b.deco ? 'block' : 'none');
}

function applyAppearance(){
  if(!appearance) appearance = loadAppearance();
  const root = document.documentElement;

  let ff = appearance.fontFamily;
  if(!ff && appearance.fontUrl && /\.(woff2?|ttf|otf|eot)(\?|#|$)/i.test(appearance.fontUrl)){
    ff = '"' + (appearance.fontName || 'WhisperCustomFont') + '"';
  }
  root.style.setProperty('--app-font', ff || DEFAULT_FONT_FAMILY);
  root.style.setProperty('--chat-font-size', (appearance.fontSize || 16) + 'px');

/* 颜色转 hex */
function toHex(color, fallback){
  if(!color) return fallback || '#000000';
  color = String(color).trim();
  if(color === 'transparent') return '#FFFFFF';
  if(color.startsWith('#')){
    if(color.length === 4) return '#' + color[1]+color[1]+color[2]+color[2]+color[3]+color[3];
    if(color.length >= 7) return color.slice(0,7);
    return fallback || '#000000';
  }
  const m = color.match(/rgba?\(([^)]+)\)/i);
  if(m){
    const parts = m[1].split(',').map(s => parseFloat(s));
    const r = Math.round(parts[0]||0), g = Math.round(parts[1]||0), b = Math.round(parts[2]||0);
    return '#' + [r,g,b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2,'0')).join('');
  }
  return fallback || '#000000';
}

/* ================= IndexedDB ================= */
const DB_NAME = 'whisperDB', DB_STORE = 'state', DB_KEY = 'main', LEGACY_KEY = 'whisper-mj-v19';
let _db = null;
function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('浏览器不支持 IndexedDB')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error || new Error('打开数据库失败'));
  });
}
async function dbSet(value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(value, DB_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('事务被中止'));
    }catch(e){ reject(e); }
  });
}
async function dbGet(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  });
}
async function dbClear(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }catch(e){ reject(e); }
  });
}

/* ================= 保存队列 ================= */
let _saveTimer = null;
let _saveQueue = Promise.resolve();
let _dirty = false;
function save(){
  _dirty = true;
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    _saveTimer = null;
    enqueueSave();
  }, 250);
}
function saveNow(){
  _dirty = true;
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  return enqueueSave();
}
function enqueueSave(){
  _saveQueue = _saveQueue.then(() => {
    if(!S) return;
    return dbSet(S).then(() => { _dirty = false; }).catch(err => {
      console.error('保存失败:', err);
      if(err && err.name === 'QuotaExceededError'){
        try{ alert('本地存储空间不足，请到「设置 → 导出/导入」清理或导出数据。'); }catch(e){}
      }
    });
  });
  return _saveQueue;
}
function flushSave(){
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  if(_dirty) enqueueSave();
}
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);

function mergeFreqSettings(settings){
  const base = JSON.parse(JSON.stringify(DEFAULT_FREQ));
  const out = { sound:true, notifications:true, typingText:'对方正在输入中…', fontFamily:'' };
  if(settings && typeof settings === 'object'){
    if(typeof settings.sound === 'boolean') out.sound = settings.sound;
    if(typeof settings.notifications === 'boolean') out.notifications = settings.notifications;
    if(typeof settings.typingText === 'string') out.typingText = settings.typingText;
    if(typeof settings.fontFamily === 'string') out.fontFamily = settings.fontFamily;
  }
  Object.keys(base).forEach(k=>{
    const cur = (settings && settings[k]) ? settings[k] : {};
    out[k] = Object.assign({}, base[k], cur);
    ['minMin','maxMin'].forEach(f=>{
      if(typeof out[k][f] !== 'number' || isNaN(out[k][f])) out[k][f] = base[k][f];
    });
    if(typeof out[k].enabled !== 'boolean') out[k].enabled = base[k].enabled;
    if(k === 'redpacketPost'){
      if(typeof out[k].minAmount !== 'number' || isNaN(out[k].minAmount)) out[k].minAmount = 50;
      if(typeof out[k].maxAmount !== 'number' || isNaN(out[k].maxAmount)) out[k].maxAmount = 10001;
      if(out[k].minAmount < 50) out[k].minAmount = 50;
      if(out[k].maxAmount < out[k].minAmount) out[k].maxAmount = 10001;
    }
  });
  return out;
}

/* ================= 迁移 ================= */
function migrate(s){
  const base = freshState();
  const d = Object.assign({}, base, s || {});

  if(!d.user || typeof d.user !== 'object') d.user = base.user;
  else d.user = Object.assign({}, base.user, d.user);
  if(!Array.isArray(d.user.avatarLibrary)) d.user.avatarLibrary = [];
  if(typeof d.user.momentsCover !== 'string') d.user.momentsCover = '';
  d.user.frame = 'none';

  d.settings = mergeFreqSettings(d.settings);

  if(!d.period || typeof d.period !== 'object') d.period = base.period;
  else d.period = Object.assign({}, base.period, d.period);
  if(!Array.isArray(d.period.records)) d.period.records = [];

  if(!d.pomodoro || typeof d.pomodoro !== 'object') d.pomodoro = base.pomodoro;
  else d.pomodoro = Object.assign({}, base.pomodoro, d.pomodoro);

  if(!Array.isArray(d.chars) || !d.chars.length) d.chars = base.chars;
  d.chars = d.chars.filter(c => c && typeof c === 'object');
  if(!d.chars.length) d.chars = base.chars;

  if(!d.messages || typeof d.messages !== 'object') d.messages = {};
  d.chars.forEach(c => {
    if(!c || !c.id) return;
    if(!Array.isArray(d.messages[c.id])) d.messages[c.id] = [];
  });

  if(!d.current || !d.chars.some(c => c.id === d.current)) d.current = d.chars[0].id;

  if(!Array.isArray(d.moments)) d.moments = [];
  if(!Array.isArray(d.letters)) d.letters = [];
  if(!Array.isArray(d.diaries)) d.diaries = [];
  if(!Array.isArray(d.anniversaries)) d.anniversaries = [];
  if(!Array.isArray(d.playlist)) d.playlist = [];
  if(!Array.isArray(d.callLogs)) d.callLogs = [];
  if(!Array.isArray(d.userCards)) d.userCards = base.userCards;
  if(!Array.isArray(d.userCardGroups)) d.userCardGroups = ['默认'];
  if(!Array.isArray(d.gridIcons) || !d.gridIcons.length) d.gridIcons = JSON.parse(JSON.stringify(DEFAULT_GRID_ICONS));
  if(!d.gridIcons.some(g => g && g.id === 'games')) d.gridIcons.push({ id:'games', label:'小游戏', ico:'🎮' });

  d.chars.forEach(c => {
    if(typeof c.id !== 'string' || !c.id) c.id = 'c' + uid();
    if(typeof c.name !== 'string' || !c.name) c.name = '萧逸';
    if(!Array.isArray(c.systemEmojis)) c.systemEmojis = DEFAULT_SYSTEM_EMOJIS.slice();
    if(!Array.isArray(c.stickers)) c.stickers = DEFAULT_MY_STICKERS.slice();
    if(!Array.isArray(c.theirEmojis)) c.theirEmojis = DEFAULT_THEIR_EMOJIS.slice();
    if(!Array.isArray(c.avatarLibrary)) c.avatarLibrary = [];
    if(!Array.isArray(c.cards)) c.cards = [];
    c.cards = c.cards.map(x => {
      if(typeof x === 'string') return {id:uid(), text:x, group:'基础字卡'};
      if(x && typeof x === 'object') return x;
      return {id:uid(), text: String(x == null ? '' : x), group:'基础字卡'};
    }).filter(x => x && x.text);
    if(!Array.isArray(c.customGroups)) c.customGroups = [];
    const groupSet = new Set(c.customGroups.filter(Boolean));
    c.cards.forEach(card => { if(card.group) groupSet.add(card.group); });
    groupSet.add('基础字卡');
    c.customGroups = Array.from(groupSet);
    if(!c.startDate) c.startDate = '2022-11-16';
    if(typeof c.minReply !== 'number') c.minReply = 5000;
    if(typeof c.maxReply !== 'number') c.maxReply = 120000;
    if(typeof c.readButNoReply !== 'boolean') c.readButNoReply = false;
    if(typeof c.onlyCards !== 'boolean') c.onlyCards = false;
    c.frame = 'none';
  });

  return d;
}

/* ================= 启动 ================= */
async function boot(){
  appearance = loadAppearance();
  applyAppearance();

  const loadingTxt = document.getElementById('loadingTxt');
  try{
    loadingTxt.textContent = '正在打开数据库…';
    let stored = null;
    try{ stored = await dbGet(); }catch(e){ console.warn('读取 IndexedDB 失败:', e); }
    if(stored && typeof stored === 'object'){
      loadingTxt.textContent = '正在加载数据…';
      S = migrate(stored);
      dbSet(S).catch(()=>{});
    } else {
      let legacy = null;
      try{ legacy = localStorage.getItem(LEGACY_KEY); }catch(e){}
      if(legacy){
        try{
          loadingTxt.textContent = '正在迁移旧数据…';
          const parsed = JSON.parse(legacy);
          S = migrate(parsed);
          await dbSet(S);
          try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        }catch(e){ console.warn('迁移旧数据失败:', e); S = freshState(); await dbSet(S); }
      } else {
        S = freshState();
        await dbSet(S);
      }
    }
  }catch(e){
    console.error('启动失败:', e);
    S = freshState();
    try{ await dbSet(S); }catch(e2){}
  }
  applyAppearance();

  const mask = document.getElementById('loadingMask');
  mask.classList.add('hide');
  setTimeout(() => mask.remove(), 500);
  try {
    startUI();
  } catch(err) {
    console.error('startUI 出错:', err);
    alert('启动出错：' + (err.message || '未知错误'));
  }
}
